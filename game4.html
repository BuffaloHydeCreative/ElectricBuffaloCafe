<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>li rassad di fleur - Studio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 10px;
        }
        canvas {
            width: 100%;
            height: 100%;
            max-width: 500px;
            object-fit: contain;
            background-color: #000000; 
            border: 4px solid #222; 
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            aspect-ratio: 3 / 4;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="533"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Core Layout Constants
        const COLS = 10;
        const ROWS = 11; // 11 rows perfectly fills the vertical arcade screen
        const CELL_SIZE = 40;
        const OFFSET_X = 0; 
        const OFFSET_Y = 80; 
        
        // Neon Lite-Brite Colors (1: Red, 2: Blue, 3: Yellow, 4: White, 0: Erase)
        const COLORS = [null, '#ff003c', '#0077ff', '#ffea00', '#ffffff'];
        const GLOWS = [null, '#aa0022', '#0044aa', '#aa9900', '#aaaaaa'];
        const COLOR_NAMES = ['ERASER', 'RED BEAD', 'BLUE BEAD', 'YELLOW BEAD', 'WHITE BEAD'];
        
        let gameState = 'START'; 
        let board = [];
        
        // Active Cursor State
        let cursor = {
            x: 4,
            y: 5,
            color: 1 // Starts with Red
        };

        // ---------------------------------------------------------
        // SIGNAL BRIDGE
        // ---------------------------------------------------------
        window.addEventListener('message', function(event) {
            const cmd = event.data;
            
            if (gameState === 'START') {
                if (cmd === 'BUTTON_A') startGame();
                return;
            }

            if (gameState === 'PLAYING') {
                if (cmd === 'DPAD_LEFT') moveCursor(-1, 0);
                if (cmd === 'DPAD_RIGHT') moveCursor(1, 0);
                if (cmd === 'DPAD_UP') moveCursor(0, -1); 
                if (cmd === 'DPAD_DOWN') moveCursor(0, 1); 
                if (cmd === 'BUTTON_B') cycleColor(); 
                if (cmd === 'BUTTON_A') placeBead(); 
            }
        });

        function startGame() {
            // Initialize empty 10x11 canvas
            board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            gameState = 'PLAYING';
        }

        function moveCursor(dx, dy) {
            cursor.x = Math.max(0, Math.min(COLS - 1, cursor.x + dx));
            cursor.y = Math.max(0, Math.min(ROWS - 1, cursor.y + dy));
        }

        function cycleColor() {
            // Cycle through 1 (Red), 2 (Blue), 3 (Yellow), 4 (White), 0 (Erase)
            cursor.color = (cursor.color + 1) % 5;
        }

        function placeBead() {
            // Lock the current cursor color into the board
            board[cursor.y][cursor.x] = cursor.color;
        }

        // ---------------------------------------------------------
        // RENDERING
        // ---------------------------------------------------------
        function drawBead(x, y, colorCode, alpha = 1.0) {
            if (colorCode === 0) return; // Empty / Erase
            
            let cx = x * CELL_SIZE + (CELL_SIZE / 2);
            let cy = y * CELL_SIZE + (CELL_SIZE / 2);
            
            ctx.globalAlpha = alpha;
            
            // Lite-Brite Glow Effect
            ctx.shadowBlur = 12;
            ctx.shadowColor = GLOWS[colorCode];
            
            // Main Peg
            ctx.fillStyle = COLORS[colorCode];
            ctx.beginPath();
            ctx.arc(cx, cy, CELL_SIZE / 2.5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0;

            // Bright Center Point (Illumination)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(cx, cy, CELL_SIZE / 10, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.globalAlpha = 1.0;
        }

        function drawScene() {
            // Background
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Matrix Grid Dots
            ctx.fillStyle = '#1a1a1a';
            for(let r = 0; r <= ROWS; r++) {
                for(let c = 0; c <= COLS; c++) {
                    ctx.beginPath();
                    ctx.arc(OFFSET_X + c*CELL_SIZE, OFFSET_Y + r*CELL_SIZE, 2, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            // Top Header UI
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText("li rassad di fleur", canvas.width/2, 30);
            
            // Display currently selected "Brush" color
            if (gameState === 'PLAYING') {
                ctx.fillStyle = cursor.color === 0 ? '#ff003c' : COLORS[cursor.color];
                ctx.font = 'bold 16px Courier New';
                ctx.fillText(`BRUSH: ${COLOR_NAMES[cursor.color]}`, canvas.width/2, 60);
            }

            // Play Area Bounds
            ctx.strokeStyle = '#33ff33';
            ctx.lineWidth = 2;
            ctx.strokeRect(OFFSET_X, OFFSET_Y, COLS * CELL_SIZE, ROWS * CELL_SIZE);

            if (gameState === 'START') {
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(OFFSET_X, OFFSET_Y, COLS * CELL_SIZE, ROWS * CELL_SIZE);
                
                // Title
                ctx.fillStyle = '#ffea00';
                ctx.font = 'bold 26px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("BEADWORK STUDIO", canvas.width/2, OFFSET_Y + 120);
                
                // Instructions
                ctx.fillStyle = '#33ff33';
                ctx.font = 'bold 16px Courier New';
                ctx.fillText("JOYSTICK : MOVE CURSOR", canvas.width/2, OFFSET_Y + 190);
                ctx.fillText("BUTTON B : CHANGE COLOR", canvas.width/2, OFFSET_Y + 230);
                ctx.fillText("BUTTON A : PLACE / ERASE", canvas.width/2, OFFSET_Y + 270);
                
                // Start Prompt
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px Courier New';
                ctx.fillText("PRESS 'A' TO START", canvas.width/2, OFFSET_Y + 350);
                return;
            }

            // Draw Placed Beads
            ctx.save();
            ctx.translate(OFFSET_X, OFFSET_Y);
            for(let r = 0; r < ROWS; r++) {
                for(let c = 0; c < COLS; c++) {
                    drawBead(c, r, board[r][c]);
                }
            }

            // Draw Active Cursor Brush Preview (Ghosted)
            if (cursor.color !== 0) {
                drawBead(cursor.x, cursor.y, cursor.color, 0.6);
            }

            // Draw Blinking Cursor Box
            let isBlinkOn = Math.floor(Date.now() / 300) % 2 === 0;
            ctx.strokeStyle = isBlinkOn ? '#ffffff' : '#333333';
            ctx.lineWidth = 3;
            ctx.strokeRect(cursor.x * CELL_SIZE, cursor.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            ctx.restore();
        }

        function gameLoop() {
            drawScene();
            requestAnimationFrame(gameLoop);
        }

        // Boot
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
