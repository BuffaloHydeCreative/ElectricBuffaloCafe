            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSynth(type, freqStart, freqEnd, duration, vol) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
            if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

            if (!audioCtx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50];

        function drawTreeToContext(targetCtx, x, y, type) {
            if (type === 'PINE') {
                targetCtx.fillStyle = PALETTE.PINE_TRUNK; targetCtx.fillRect(x + 10, y + 20, 4, 10);
                targetCtx.fillStyle = PALETTE.PINE_LEAF; targetCtx.fillRect(x + 2, y + 12, 20, 10);
                targetCtx.fillRect(x + 6, y + 4, 12, 12); targetCtx.fillRect(x + 10, y - 4, 4, 12);
            } else if (type === 'BIRCH') {
                targetCtx.fillStyle = PALETTE.BIRCH_TRUNK; targetCtx.fillRect(x + 10, y + 10, 4, 20);
                targetCtx.fillStyle = PALETTE.BIRCH_MARK; targetCtx.fillRect(x + 10, y + 14, 2, 2); targetCtx.fillRect(x + 12, y + 22, 2, 2);
                targetCtx.fillStyle = PALETTE.BIRCH_LEAF; targetCtx.fillRect(x, y - 2, 24, 16); targetCtx.fillRect(x + 4, y - 8, 16, 10);
            } else if (type === 'SNOW_PINE') {
                targetCtx.fillStyle = '#14172b'; targetCtx.fillRect(x + 10, y + 20, 4, 10);
                targetCtx.fillStyle = '#192942'; targetCtx.fillRect(x + 2, y + 12, 20, 10);
                targetCtx.fillRect(x + 6, y + 4, 12, 12); targetCtx.fillRect(x + 10, y - 4, 4, 12);
                targetCtx.fillStyle = PALETTE.MTN_SNOW;
                targetCtx.fillRect(x + 10, y - 4, 4, 3);
                targetCtx.fillRect(x + 6, y + 4, 6, 2);
                targetCtx.fillRect(x + 3, y + 12, 8, 2);
            }
        }

        function drawSteppedMountainBlock(targetCtx, x, y, w, h, isVerticalRidge) {
            targetCtx.fillStyle = PALETTE.MTN_BASE;
            targetCtx.fillRect(x, y, w, h);

            targetCtx.fillStyle = PALETTE.MTN_MID;
            targetCtx.fillRect(x + 6, y + 6, Math.max(4, w - 12), Math.max(4, h - 14));

            targetCtx.fillStyle = PALETTE.MTN_HIGH;
            if (isVerticalRidge) {
                targetCtx.fillRect(x + 16, y + 12, Math.max(4, w - 32), Math.max(4, h - 24));
                targetCtx.fillStyle = PALETTE.MTN_SNOW;
                let spineX = x + Math.floor(w / 2) - 6;
                for (let sy = y + 18; sy < y + h - 22; sy += 24) {
                    targetCtx.fillRect(spineX, sy, 12, 14);
                    targetCtx.fillRect(spineX - 4, sy + 4, 20, 6);
                }
            } else {
                targetCtx.fillRect(x + 10, y + 8, Math.max(4, w - 20), Math.max(4, h - 38));
                targetCtx.fillStyle = PALETTE.MTN_SNOW;
                for (let px = x + 20; px < x + w - 40; px += 68) {
                    targetCtx.fillRect(px + 14, y + 6, 16, 12);
                    targetCtx.fillRect(px + 8,  y + 18, 28, 12);
                    targetCtx.fillRect(px + 2,  y + 30, 40, 10);
                }
                targetCtx.fillStyle = PALETTE.MTN_BASE;
                for (let sx = x + 16; sx < x + w - 16; sx += 22) {
                    targetCtx.fillRect(sx, y + 48, 4, Math.max(10, h - 64));
                }
            }
        }

        function drawLandShapeToContext(targetCtx, s, isPrairie, isNorthern) {
            if (s.type === 'MOUNTAIN') {
                drawSteppedMountainBlock(targetCtx, s.x, s.y, s.w, s.h, false);
                return;
            }
            if (s.type === 'RIDGE') {
                drawSteppedMountainBlock(targetCtx, s.x, s.y, s.w, s.h, true);
                return;
            }
            if (s.type === 'PEBBLE_ROUGH') {
                targetCtx.fillStyle = PALETTE.PEBBLE_BUFFER;
                targetCtx.fillRect(s.x, s.y, s.w, s.h);
                targetCtx.fillStyle = PALETTE.PEBBLE_SPECK;
                for (let px = s.x + 4; px < s.x + s.w - 4; px += 12) {
                    for (let py = s.y + 4; py < s.y + s.h - 4; py += 10) {
                        let shift = ((py / 10) % 2 === 0) ? 0 : 5;
                        if (px + shift < s.x + s.w - 4) {
                            targetCtx.fillRect(px + shift, py, 3, 3);
                        }
                    }
                }
                return;
            }

            if (s.type === 'FAIRWAY') {
                targetCtx.fillStyle = isPrairie ? PALETTE.FAIRWAY_PRAIRIE : (isNorthern ? PALETTE.FAIRWAY_NORTH : PALETTE.FAIRWAY_WOOD);
            } else if (s.type === 'SAND') {
                targetCtx.fillStyle = isNorthern ? PALETTE.SAND_NORTH : PALETTE.SAND;
            } else if (s.type === 'GREEN') {
                targetCtx.fillStyle = isNorthern ? PALETTE.GREEN_NORTH : PALETTE.GREEN;
            } else {
                targetCtx.fillStyle = PALETTE[s.type];
            }
            
            targetCtx.fillRect(s.x, s.y, s.w, s.h);

            if (s.type === 'SAND') {
                targetCtx.fillStyle = isNorthern ? PALETTE.SAND_NORTH_DARK : PALETTE.SAND_DARK;
                for (let sx = s.x + 4; sx < s.x + s.w - 6; sx += 12) {
                    for (let sy = s.y + 4; sy < s.y + s.h - 4; sy += 10) {
                        let shift = ((sy / 10) % 2 === 0) ? 0 : 5;
                        if (sx + shift < s.x + s.w - 6) {
                            targetCtx.fillRect(sx + shift, sy, 5, 3);
                        }
                    }
                }
            }
            if (s.type === 'GREEN') {
                targetCtx.fillStyle = isNorthern ? PALETTE.GREEN_NORTH_DARK : PALETTE.GREEN_DARK;
                for (let gx = s.x + 4; gx < s.x + s.w - 4; gx += 12) {
                    for (let gy = s.y + 4; gy < s.y + s.h - 4; gy += 12) {
                        let shift = ((gy / 12) % 2 === 0) ? 0 : 6;
                        if (gx + shift < s.x + s.w - 4) {
                            targetCtx.fillRect(gx + shift, gy, 4, 4);
                        }
                    }
                }
            }
        }

        function bakeTerrain() {
            const hole = activeCourseHoles[currentHole];
            offCanvas.width = hole.worldW; offCanvas.height = hole.worldH;

            const isPrairie = (selectedCourseIdx === 1);
            const isNorthern = (selectedCourseIdx === 2);

            if (isNorthern) {
                offCtx.fillStyle = PALETTE.ROUGH_NORTH;
                offCtx.fillRect(0, 0, hole.worldW, hole.worldH);

                offCtx.fillStyle = PALETTE.ROUGH_NORTH_LAV;
                for (let i = 0; i < (hole.worldW * hole.worldH) / 1400; i++) {
                    let rx = Math.floor(Math.random() * (hole.worldW / 8)) * 8;
                    let ry = Math.floor(Math.random() * (hole.worldH / 8)) * 8;
                    offCtx.fillRect(rx, ry, 16, 8);
                }
                offCtx.fillStyle = PALETTE.ROUGH_NORTH_DARK;
                for (let i = 0; i < (hole.worldW * hole.worldH) / 1200; i++) {
                    let rx = Math.floor(Math.random() * (hole.worldW / 4)) * 4;
                    let ry = Math.floor(Math.random() * (hole.worldH / 4)) * 4;
                    offCtx.fillRect(rx, ry, 8, 8);
                }

                for (let ay = 40; ay < hole.worldH; ay += 140) {
                    offCtx.fillStyle = 'rgba(82, 242, 178, 0.09)';
                    offCtx.fillRect(0, ay, hole.worldW, 24);
                    offCtx.fillStyle = 'rgba(168, 120, 255, 0.08)';
                    offCtx.fillRect(0, ay + 24, hole.worldW, 18);
                }
                for (let i = 0; i < (hole.worldW * hole.worldH) / 3200; i++) {
                    offCtx.fillStyle = (i % 3 === 0) ? 'rgba(255, 255, 255, 0.45)' : 'rgba(158, 168, 224, 0.35)';
                    offCtx.fillRect(Math.random() * hole.worldW, Math.random() * hole.worldH, 2, 2);
                }
            } else if (isPrairie) {
                offCtx.fillStyle = PALETTE.ROUGH_PRAIRIE;
                offCtx.fillRect(0, 0, hole.worldW, hole.worldH);
                offCtx.fillStyle = PALETTE.ROUGH_PRAIRIE_DARK;
                for (let i = 0; i < (hole.worldW * hole.worldH) / 75; i++) {
                    offCtx.fillRect(Math.random() * hole.worldW, Math.random() * hole.worldH, 2, 8);
                }
                offCtx.fillStyle = PALETTE.ROUGH_PRAIRIE_TALL;
                for (let i = 0; i < (hole.worldW * hole.worldH) / 90; i++) {
                    offCtx.fillRect(Math.random() * hole.worldW, Math.random() * hole.worldH, 3, 5);
                }
            } else {
                offCtx.fillStyle = PALETTE.ROUGH_WOOD;
                offCtx.fillRect(0, 0, hole.worldW, hole.worldH);
                offCtx.fillStyle = '#0a1f16';
                for (let i = 0; i < (hole.worldW * hole.worldH) / 100; i++) { offCtx.fillRect(Math.random() * hole.worldW, Math.random() * hole.worldH, 2, 6); }
                offCtx.fillStyle = '#1b402c'; 
                for (let i = 0; i < (hole.worldW * hole.worldH) / 100; i++) { offCtx.fillRect(Math.random() * hole.worldW, Math.random() * hole.worldH, 2, 4); }
            }

            for (let s of hole.shapes) {
                if (s.type === 'WATER' || s.type === 'WATERFALL' || s.type === 'HAZARD_ROCK') continue;
                drawLandShapeToContext(offCtx, s, isPrairie, isNorthern);
            }

            if (!isPrairie) {
                let treeCount = isNorthern ? (hole.worldH > 400 ? 220 : 95) : (hole.worldH > 400 ? 380 : 180);
                for (let i = 0; i < treeCount; i++) {
                    let tx = Math.random() * hole.worldW; let ty = Math.random() * hole.worldH;
                    let canSpawn = true;
                    if (Math.hypot(tx - hole.tee.x, ty - hole.tee.y) < 65) canSpawn = false;
                    for (let s of hole.shapes) {
                        if (s.type === 'HAZARD_ROCK') continue;
                        let buf = (s.type === 'MOUNTAIN' || s.type === 'RIDGE') ? 8 : 32;
                        if (tx >= s.x - buf && tx <= s.x + s.w + buf && ty >= s.y - buf && ty <= s.y + s.h + buf) {
                            canSpawn = false; break;
                        }
                    }
                    if (canSpawn) {
                        if (isNorthern) drawTree(tx, ty, 'SNOW_PINE');
                        else drawTree(tx, ty, Math.random() > 0.4 ? 'PINE' : 'BIRCH');
                    }
                }
            }
        }

        function loadHole(idx) {
            currentHole = idx; strokes = 0; lie = 'TEE'; clubIdx = 0;
            const hole = activeCourseHoles[idx];

            ball.x = hole.tee.x; ball.y = hole.tee.y; ball.z = 0;
            ball.prevX = ball.x; ball.prevY = ball.y;
            aimAngle = hole.startAngle !== undefined ? hole.startAngle : -Math.PI / 2; 

            state = 'AIM'; shotFeedback = ""; puttingState.active = false;
            meter.powerMarker = -1; meter.accuracyMarker = -1;
            
            if (hole.worldH > 400) {
                let projY = Math.max(0, Math.min(hole.worldH, ball.y + Math.sin(aimAngle) * CLUBS[clubIdx].dist));
                targetCamY = getTargetCameraY(hole, projY);
            } else {
                targetCamY = 0;
            }
            camY = targetCamY;

            if (selectedCourseIdx === 1 && currentHole === 1) {
                spawnBuffaloHerd();
            }

            bakeTerrain();
        }

        function getTerrainAt(x, y) {
            const hole = activeCourseHoles[currentHole];
            if (x < 0 || x >= hole.worldW || y < 0 || y >= hole.worldH) return 'OB';
            for (let i = hole.shapes.length - 1; i >= 0; i--) {
                const s = hole.shapes[i];
                if (x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h) {
                    if (s.type === 'PEBBLE_ROUGH') return 'ROUGH';
                    if (s.type === 'WATERFALL') return 'WATER';
                    if (s.type === 'MOUNTAIN' || s.type === 'RIDGE' || s.type === 'HAZARD_ROCK') return 'OB';
                    return s.type; 
                }
            }
            return 'ROUGH';
        }

        function handleA_Button() {
            initAudio();
            if (state === 'TITLE') { 
                state = 'COURSE_SELECT'; playSynth('triangle', 350, 450, 0.1, 0.3); 
            } 
            else if (state === 'COURSE_SELECT') {
                if (COURSES[selectedCourseIdx].status === 'AVAILABLE') { 
                    courseScores = [0, 0, 0];
                    activeCourseHoles = COURSES[selectedCourseIdx].holes;
                    initGlobalConditions();
                    playSynth('triangle', 440, 660, 0.15, 0.4); 
                    state = 'COURSE_SPLASH';
                } 
                else playSynth('triangle', 150, 90, 0.25, 0.5); 
            }
            else if (state === 'COURSE_SPLASH') {
                playSynth('triangle', 523.25, 783.99, 0.18, 0.4);
                loadHole(0);
            }
            else if (state === 'POST_HOLE') {
                if (currentHole < 2) {
                    loadHole(currentHole + 1);
                } else {
                    state = 'FINAL_SCORECARD';
                    playSynth('triangle', 523.25, 659.25, 0.25, 0.4);
                }
            } 
            else if (state === 'FINAL_SCORECARD') {
                state = 'COURSE_SELECT';
                currentHole = 0;
                initGlobalConditions();
                playSynth('triangle', 350, 450, 0.1, 0.3);
            }
            else if (state === 'AIM') {
                state = 'POWER'; meter.val = 0; meter.dir = 0.81; shotFeedback = "";
                playSynth('triangle', 300, 400, 0.1, 0.2);
            } 
            else if (state === 'POWER') {
                meter.power = meter.val; meter.powerMarker = meter.val; state = 'SNAP'; meter.dir = -1.69; 
                playSynth('triangle', 400, 500, 0.1, 0.2);
            } 
            else if (state === 'SNAP') {
                meter.accuracy = meter.val; meter.accuracyMarker = meter.val; hitBall();
            }
        }

        function handleB_Button() {
            initAudio();
            if (state === 'COURSE_SELECT') { 
                state = 'TITLE'; playSynth('triangle', 300, 200, 0.1, 0.3); 
            }
            else if (state === 'COURSE_SPLASH') {
                state = 'COURSE_SELECT'; playSynth('triangle', 300, 200, 0.1, 0.3);
            }
            else if (state === 'AIM' || state === 'FLY' || state === 'ROLL') { 
                showMiniMap = !showMiniMap; playSynth('triangle', 450, 450, 0.05, 0.2); 
            }
        }

        function hitBall() {
            strokes++; 
            courseScores[currentHole] = strokes;
            state = 'FLY'; let club = CLUBS[clubIdx];

            let sweetCenter = 25; 
            let deviation = (meter.accuracy - sweetCenter) / 100;
            let finalAngle = aimAngle + (deviation * 0.9);

            let missDiff = Math.abs(meter.accuracy - sweetCenter);
            if (missDiff <= 5) shotFeedback = "GREAT SHOT!";
            else if (missDiff <= 13) shotFeedback = "AVERAGE";
            else shotFeedback = "POOR SHOT!";

            let pwr = Math.max(0.05, meter.power / 100);

            if (puttingState.active) {
                let puttForce = pwr * 8.5;
                ball.vx = Math.cos(finalAngle) * puttForce;
                ball.vy = Math.sin(finalAngle) * puttForce;
                ball.vz = 0; state = 'ROLL';
                playSynth('square', 100, 60, 0.15, 0.6);
                return;
            }

            let liePenalty = 1.0; let zPenalty = 1.0;
            if (lie === 'ROUGH') {
                if (clubIdx === 0) { liePenalty = 0.35; zPenalty = 0.35; } else liePenalty = 0.75;
            } else if (lie === 'SAND') {
                if (clubIdx === 0) { liePenalty = 0.20; zPenalty = 0.20; }
                else if (clubIdx === 1) { liePenalty = 0.45; zPenalty = 0.45; }
                else liePenalty = 0.75;
            }

            let speedModifier = club.speed * pwr * liePenalty;
            ball.prevX = ball.x; ball.prevY = ball.y;
            ball.vx = Math.cos(finalAngle) * speedModifier;
            ball.vy = Math.sin(finalAngle) * speedModifier;
            ball.vz = club.vZ * pwr * zPenalty;
            if (clubIdx === 3) ball.vz = 0;

            playSynth('square', 80, 40, 0.2, 0.8);
        }

        /* --- INDEX.HTML POSTMESSAGE BRIDGE (PULSE-AWARE DPAD + DEBOUNCED BUTTONS) --- */
        const dpadReleaseTimers = { up: null, down: null, left: null, right: null };
        const DPAD_PULSE_HOLD_MS = 125; // Matches index.html 100ms repeat cadence without sticky latch
        let lastBtnATime = 0;
        let lastBtnBTime = 0;
        const BUTTON_DEBOUNCE_MS = 120;

        function triggerDpadPulse(dir) {
            if (dir === 'up') dpad.down = false;
            else if (dir === 'down') dpad.up = false;
            else if (dir === 'left') dpad.right = false;
            else if (dir === 'right') dpad.left = false;

            dpad[dir] = true;
            if (dpadReleaseTimers[dir]) clearTimeout(dpadReleaseTimers[dir]);
            dpadReleaseTimers[dir] = setTimeout(() => {
                dpad[dir] = false;
                dpadReleaseTimers[dir] = null;
            }, DPAD_PULSE_HOLD_MS);
        }

        function clearAllDpad() {
            for (const dir of ['up', 'down', 'left', 'right']) {
                dpad[dir] = false;
                if (dpadReleaseTimers[dir]) {
                    clearTimeout(dpadReleaseTimers[dir]);
                    dpadReleaseTimers[dir] = null;
                }
            }
        }

        window.addEventListener('message', function(event) {
            const cmd = event.data;
            if (typeof cmd !== 'string') return;

            if (cmd === 'DPAD_UP' || cmd === 'DPAD_UP_PRESS') triggerDpadPulse('up');
            else if (cmd === 'DPAD_UP_RELEASE') { dpad.up = false; clearTimeout(dpadReleaseTimers.up); }
            else if (cmd === 'DPAD_DOWN' || cmd === 'DPAD_DOWN_PRESS') triggerDpadPulse('down');
            else if (cmd === 'DPAD_DOWN_RELEASE') { dpad.down = false; clearTimeout(dpadReleaseTimers.down); }
            else if (cmd === 'DPAD_LEFT' || cmd === 'DPAD_LEFT_PRESS') triggerDpadPulse('left');
            else if (cmd === 'DPAD_LEFT_RELEASE') { dpad.left = false; clearTimeout(dpadReleaseTimers.left); }
            else if (cmd === 'DPAD_RIGHT' || cmd === 'DPAD_RIGHT_PRESS') triggerDpadPulse('right');
            else if (cmd === 'DPAD_RIGHT_RELEASE') { dpad.right = false; clearTimeout(dpadReleaseTimers.right); }
            else if (cmd === 'BUTTON_A') {
                const now = performance.now();
                if (now - lastBtnATime >= BUTTON_DEBOUNCE_MS) {
                    lastBtnATime = now;
                    handleA_Button();
                }
            }
            else if (cmd === 'BUTTON_B') {
                const now = performance.now();
                if (now - lastBtnBTime >= BUTTON_DEBOUNCE_MS) {
                    lastBtnBTime = now;
                    handleB_Button();
                }
            }
            else if (cmd === 'PAUSE' || cmd === 'RESUME') {
                clearAllDpad();
            }
        });

        function handleMenuNavigation(key, changeVal) {
            let now = Date.now();
            if (dpad[key]) {
                if (inputTimers[key] === 0) {
                    selectedCourseIdx = Math.max(0, Math.min(COURSES.length - 1, selectedCourseIdx + changeVal));
                    playSynth('triangle', 240, 240, 0.05, 0.2); inputTimers[key] = now;
                } else if (now - inputTimers[key] > 280) {
                    selectedCourseIdx = Math.max(0, Math.min(COURSES.length - 1, selectedCourseIdx + changeVal));
                    playSynth('triangle', 240, 240, 0.05, 0.2); inputTimers[key] = now - 180;
                }
            } else inputTimers[key] = 0;
        }

        function handleClubSelectionInput(key, changeVal) {
            if (puttingState.active) return;
            let now = Date.now();
            if (dpad[key]) {
                if (inputTimers[key] === 0) {
                    clubIdx = Math.max(0, Math.min(3, clubIdx + changeVal)); inputTimers[key] = now;
                } else if (now - inputTimers[key] > 300) {
                    clubIdx = Math.max(0, Math.min(3, clubIdx + changeVal)); inputTimers[key] = now - 200;
                }
            } else inputTimers[key] = 0;
        }

        function initPuttingMiniGame() {
            puttingState.active = true; clubIdx = 3; 
            const hole = activeCourseHoles[currentHole];

            let dx = (ball.x - hole.pin.x) * puttingState.zoomScale;
            let dy = (ball.y - hole.pin.y) * puttingState.zoomScale;
            ball.x = puttingState.cupX + dx;
            ball.y = puttingState.cupY + dy;
            ball.z = 0; ball.vx = 0; ball.vy = 0;

            puttingState.isDualSlope = assignedDualSlopeHoles.includes(currentHole);
            puttingState.splitAxis = Math.random() > 0.5 ? 'x' : 'y';
            puttingState.splitVal = puttingState.splitAxis === 'x' ? 300 : 160;

            const subtleSlope = () => {
                let dir = Math.floor(Math.random() * 8);
                let ang = dir * (Math.PI / 4);
                let mag = 0.0035 + (Math.random() * 0.0025);
                return { x: Math.cos(ang) * mag, y: Math.sin(ang) * mag };
            };

            puttingState.slope1 = subtleSlope();
            puttingState.slope2 = subtleSlope();

            aimAngle = Math.atan2(puttingState.cupY - ball.y, puttingState.cupX - ball.x);
            state = 'AIM';
        }

        function getActiveSlope(screenX, screenY) {
            if (!puttingState.isDualSlope) return puttingState.slope1;
            let val = (puttingState.splitAxis === 'x') ? screenX : screenY;
            return (val < puttingState.splitVal) ? puttingState.slope1 : puttingState.slope2;
        }

        function exitPuttingOffGreen(worldX, worldY) {
            const hole = activeCourseHoles[currentHole];
            ball.x = worldX; ball.y = worldY;
            ball.vx = ball.vx / puttingState.zoomScale; 
            ball.vy = ball.vy / puttingState.zoomScale;
            ball.z = 0; ball.vz = 0; ball.prevX = ball.x; ball.prevY = ball.y;

            puttingState.active = false;
            targetCamY = hole.worldH > 400 ? Math.max(0, Math.min(hole.worldH - 400, ball.y - 200)) : 0;
            camY = targetCamY;
            
            shotFeedback = "OFF GREEN!";
            state = 'ROLL';
        }

        function gameLoop() {
            update(); draw(); requestAnimationFrame(gameLoop);
        }

        function getTargetCameraY(hole, focusY) {
            if (hole.worldH <= 400) return 0;
            if (hole.worldH > 900) {
                if (focusY < 370) return 0;
                if (focusY < 710) return 340;
                return 680;
            } else {
                return (focusY < (hole.worldH - 400) + 70) ? 0 : (hole.worldH - 400);
            }
        }

        function triggerHazardReset(hole, feedbackText) {
            strokes++;
            courseScores[currentHole] = strokes;
            ball.x = ball.prevX;
            ball.y = ball.prevY;
            ball.z = 0;
            ball.vx = 0;
            ball.vy = 0;
            ball.vz = 0;
            lie = getTerrainAt(ball.x, ball.y);
            if (lie === 'OB' || lie === 'WATER') lie = 'FAIRWAY';
            if (hole.worldH > 400) targetCamY = getTargetCameraY(hole, ball.y);
            playSynth('noise', 400, 100, 0.4, 0.8);
            shotFeedback = feedbackText || "HAZARD +1";
            state = 'AIM';
        }

        function update() {
            if (state === 'COURSE_SELECT' || state === 'COURSE_SPLASH' || state === 'FINAL_SCORECARD') { 
                if (state === 'COURSE_SELECT') {
                    handleMenuNavigation('up', -1); 
                    handleMenuNavigation('down', 1); 
                }
                return; 
            }

            const hole = activeCourseHoles[currentHole];

            if (selectedCourseIdx === 1 && currentHole === 1 && !puttingState.active) {
                for (let b of buffalos) {
                    b.chewAnim += 0.05;
                    b.x += b.vx;
                    b.y += b.vy;
                    if (b.x < 275 || b.x > 395) b.vx *= -1;
                    if (b.y < 195 || b.y > 335) b.vy *= -1;
                }
            }

            if (state === 'AIM') {
                if (dpad.left) aimAngle -= 0.03; if (dpad.right) aimAngle += 0.03;
                handleClubSelectionInput('up', -1); handleClubSelectionInput('down', 1);

                if (!puttingState.active && hole.worldH > 400) {
                    let projY = Math.max(0, Math.min(hole.worldH, ball.y + Math.sin(aimAngle) * CLUBS[clubIdx].dist));
                    targetCamY = getTargetCameraY(hole, projY);
                }
            }
            else if (state === 'POWER' || state === 'SNAP') {
                if (!puttingState.active && hole.worldH > 400) {
                    targetCamY = getTargetCameraY(hole, ball.y);
                }

                meter.val += meter.dir;
                if (state === 'POWER' && meter.val > 100) { meter.val = 100; meter.dir *= -1; }
                if (state === 'SNAP' && meter.val < 0) { meter.val = 0; meter.accuracy = 0; meter.accuracyMarker = 0; hitBall(); }
            }
            else if (state === 'FLY' || state === 'ROLL') {
                ball.x += ball.vx; ball.y += ball.vy;

                if (!puttingState.active && hole.worldH > 400) {
                    targetCamY = getTargetCameraY(hole, ball.y);
                }

                if (selectedCourseIdx === 1 && currentHole === 1 && !puttingState.active && ball.z < 7) {
                    for (let b of buffalos) {
                        if (Math.hypot(ball.x - b.x, ball.y - b.y) < 13) {
                            ball.vx = -ball.vx * 0.45;
                            ball.vy = -ball.vy * 0.45;
                            ball.x += ball.vx * 2;
                            ball.y += ball.vy * 2;
                            ball.z = 0;
                            state = 'ROLL';
                            playSynth('sawtooth', 95, 55, 0.25, 0.5);
                            break;
                        }
                    }
                }

                if (selectedCourseIdx === 2 && !puttingState.active) {
                    for (let s of hole.shapes) {
                        if ((s.type === 'RIDGE' || s.type === 'MOUNTAIN') &&
                            ball.x >= s.x && ball.x <= s.x + s.w &&
                            ball.y >= s.y && ball.y <= s.y + s.h) {
                            triggerHazardReset(hole, "ROCK HAZARD +1");
                            return;
                        }
                    }
                }

                if (state === 'FLY') {
                    ball.vx += Math.cos(sessionConditions.dirAngle) * (sessionConditions.speed * 0.001);
                    ball.vy += Math.sin(sessionConditions.dirAngle) * (sessionConditions.speed * 0.001);
                    
                    ball.z += ball.vz; ball.vz -= GRAVITY;
                    if (ball.z <= 0) { ball.z = 0; state = 'ROLL'; }
                } else if (state === 'ROLL') {
                    if (puttingState.active) {
                        let activeSlope = getActiveSlope(ball.x, ball.y);
                        
                        ball.vx *= sessionConditions.puttingFriction; 
                        ball.vy *= sessionConditions.puttingFriction;
                        
                        let currentSpeed = Math.hypot(ball.vx, ball.vy);
                        if (currentSpeed > 0.08) {
                            ball.vx += activeSlope.x;
                            ball.vy += activeSlope.y;
                        }

                        let worldX = hole.pin.x + (ball.x - puttingState.cupX) / puttingState.zoomScale;
                        let worldY = hole.pin.y + (ball.y - puttingState.cupY) / puttingState.zoomScale;
                        
                        let terr = getTerrainAt(worldX, worldY);
                        if (terr !== 'GREEN' && terr !== 'GREEN_DARK') {
                            exitPuttingOffGreen(worldX, worldY); return;
                        }

                        let distToCup = Math.hypot(ball.x - puttingState.cupX, ball.y - puttingState.cupY);

                        if (distToCup < puttingState.cupRadius + 1) {
                            if (currentSpeed < 3.2) {
                                ball.x = puttingState.cupX; ball.y = puttingState.cupY; ball.vx = 0; ball.vy = 0;
                                state = 'HOLE_OUT'; playSinkJingle(); 
                                setTimeout(() => { 
                                    state = 'POST_HOLE';
                                }, 2200);
                                return;
                            } else {
                                playSynth('square', 320, 240, 0.08, 0.4);
                                ball.vx = -ball.vx * 0.35; ball.vy = -ball.vy * 0.35;
                            }
                        }
                        if (currentSpeed < 0.08) {
                            ball.vx = 0; ball.vy = 0; 
                            aimAngle = Math.atan2(puttingState.cupY - ball.y, puttingState.cupX - ball.x); 
                            state = 'AIM';
                        }
                    } else {
                        let curTerr = getTerrainAt(ball.x, ball.y);
                        let friction = CLUBS[clubIdx].roll;
                        if (curTerr === 'ROUGH') friction *= 0.75;
                        if (curTerr === 'SAND') friction *= 0.45;
                        ball.vx *= friction; ball.vy *= friction;

                        if (Math.abs(ball.vx) < 0.1 && Math.abs(ball.vy) < 0.1) { ball.vx = 0; ball.vy = 0; resolveLie(); }
                    }
                }
            }

            if (!puttingState.active && hole.worldH > 400) camY += (targetCamY - camY) * 0.14;
            else if (puttingState.active) camY = 0;
        }

        function resolveLie() {
            let curTerr = getTerrainAt(ball.x, ball.y); let hole = activeCourseHoles[currentHole];
            let distToPin = Math.hypot(ball.x - hole.pin.x, ball.y - hole.pin.y);

            if (curTerr === 'WATER' || curTerr === 'OB') {
                triggerHazardReset(hole, curTerr === 'WATER' ? "WATER +1" : "HAZARD +1");
            } 
            else if (distToPin < 8) { 
                state = 'HOLE_OUT'; playSinkJingle(); 
                setTimeout(() => { state = 'POST_HOLE'; }, 2200); 
            } 
            else if (curTerr === 'GREEN') initPuttingMiniGame(); 
            else { lie = curTerr; clubIdx = (lie === 'SAND' ? 2 : clubIdx); state = 'AIM'; }
        }

        function drawHoleMiniMapBox(hole, courseIdx, boxX, boxY, boxW, boxH, holeLabel) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.90)';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = PALETTE.UI_ORANGE;
            ctx.lineWidth = 2;
            ctx.strokeRect(boxX, boxY, boxW, boxH);

            ctx.fillStyle = PALETTE.WHITE;
            ctx.font = '7px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.fillText(holeLabel, boxX + boxW / 2, boxY + 11);

            const innerX = boxX + 6;
            const innerY = boxY + 15;
            const innerW = boxW - 12;
            const innerH = boxH - 20;

            if (!hole) {
                ctx.fillStyle = '#1d242b';
                ctx.fillRect(innerX, innerY, innerW, innerH);
                ctx.fillStyle = '#555555';
                ctx.font = '10px "Press Start 2P"';
                ctx.fillText("?", boxX + boxW / 2, innerY + innerH / 2 + 4);
                return;
            }

            if (courseIdx === 1) ctx.fillStyle = PALETTE.ROUGH_PRAIRIE_DARK;
            else if (courseIdx === 2) ctx.fillStyle = PALETTE.ROUGH_NORTH;
            else ctx.fillStyle = PALETTE.ROUGH_WOOD;
            ctx.fillRect(innerX, innerY, innerW, innerH);

            const scaleX = innerW / hole.worldW;
            const scaleY = innerH / hole.worldH;

            for (let s of hole.shapes) {
                if (s.type === 'HAZARD_ROCK') continue;
                if (s.type === 'FAIRWAY') {
                    ctx.fillStyle = (courseIdx === 1) ? PALETTE.FAIRWAY_PRAIRIE : (courseIdx === 2 ? PALETTE.FAIRWAY_NORTH : PALETTE.FAIRWAY_WOOD);
                } else if (s.type === 'PEBBLE_ROUGH') {
                    ctx.fillStyle = PALETTE.PEBBLE_BUFFER;
                } else if (s.type === 'WATER' || s.type === 'WATERFALL') {
                    ctx.fillStyle = (courseIdx === 1) ? PALETTE.WATER_SILT : (courseIdx === 2 ? PALETTE.WATER_GLACIAL : PALETTE.WATER_BLUE);
                } else if (s.type === 'MOUNTAIN' || s.type === 'RIDGE') {
                    ctx.fillStyle = PALETTE.MTN_HIGH;
                } else if (s.type === 'SAND') {
                    ctx.fillStyle = (courseIdx === 2) ? PALETTE.SAND_NORTH : PALETTE.SAND;
                } else if (s.type === 'GREEN') {
                    ctx.fillStyle = (courseIdx === 2) ? PALETTE.GREEN_NORTH : PALETTE.GREEN;
                } else {
                    ctx.fillStyle = PALETTE[s.type];
                }

                ctx.fillRect(
                    innerX + (s.x * scaleX),
                    innerY + (s.y * scaleY),
                    Math.max(2, s.w * scaleX),
                    Math.max(2, s.h * scaleY)
                );
            }

            ctx.fillStyle = PALETTE.TEE_BLUE_LIGHT;
            ctx.fillRect(innerX + (hole.tee.x * scaleX) - 2, innerY + (hole.tee.y * scaleY) - 2, 4, 4);

            ctx.fillStyle = (Date.now() % 400 < 200) ? PALETTE.UI_ORANGE : PALETTE.WHITE;
            ctx.fillRect(innerX + (hole.pin.x * scaleX) - 2, innerY + (hole.pin.y * scaleY) - 2, 4, 4);
        }

        function drawGriddedScorecard(scX, scY, scW, scH, holesArr, scoresArr, showLiveColors) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
            ctx.fillRect(scX, scY, scW, scH);
            ctx.strokeStyle = PALETTE.UI_ORANGE;
            ctx.lineWidth = 2;
            ctx.strokeRect(scX, scY, scW, scH);

            ctx.fillStyle = PALETTE.WHITE;
            ctx.font = '8px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.fillText("SCORECARD", scX + scW / 2, scY + 12);

            const headerH = 17;
            const bodyH = scH - headerH;
            const rowH = bodyH / 3;

            ctx.strokeStyle = '#555555';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(scX, scY + headerH);
            ctx.lineTo(scX + scW, scY + headerH);
            ctx.moveTo(scX, scY + headerH + rowH);
            ctx.lineTo(scX + scW, scY + headerH + rowH);
            ctx.moveTo(scX, scY + headerH + rowH * 2);
            ctx.lineTo(scX + scW, scY + headerH + rowH * 2);

            const labelColW = Math.floor(scW * 0.18);
            const totColW = Math.floor(scW * 0.28);
            const holeColW = (scW - labelColW - totColW) / 3;

            for (let c = 0; c < 4; c++) {
                let lx = scX + labelColW + (c * holeColW);
                ctx.moveTo(lx, scY + headerH);
                ctx.lineTo(lx, scY + scH);
            }
            ctx.stroke();

            ctx.font = '6px "Press Start 2P"';
            ctx.fillStyle = PALETTE.WHITE;
            ctx.textAlign = 'left';
            ctx.fillText("HL", scX + 5, scY + headerH + rowH * 0.72);
            ctx.fillText("PR", scX + 5, scY + headerH + rowH * 1.72);
            ctx.fillText("SC", scX + 5, scY + headerH + rowH * 2.72);

            ctx.textAlign = 'center';
            for (let i = 0; i < 3; i++) {
                let cx = scX + labelColW + (i * holeColW) + (holeColW / 2);
                ctx.fillStyle = PALETTE.WHITE;
                ctx.fillText(i + 1, cx, scY + headerH + rowH * 0.72);

                let parVal = holesArr ? holesArr[i].par : "-";
                ctx.fillText(parVal, cx, scY + headerH + rowH * 1.72);

                let dispScore = "-";
                if (scoresArr && (i < currentHole || (i === currentHole && scoresArr[i] > 0))) {
                    dispScore = scoresArr[i];
                }

                if (showLiveColors && dispScore !== "-" && holesArr) {
                    let diff = dispScore - holesArr[i].par;
                    if (diff < 0) ctx.fillStyle = PALETTE.GREEN;
                    else if (diff > 0) ctx.fillStyle = PALETTE.RED;
                    else ctx.fillStyle = PALETTE.WHITE;
                } else {
                    ctx.fillStyle = PALETTE.WHITE;
                }
                ctx.fillText(dispScore, cx, scY + headerH + rowH * 2.72);
            }

            let cxTot = scX + scW - (totColW / 2);
            ctx.fillStyle = PALETTE.WHITE;
            ctx.fillText("TOT", cxTot, scY + headerH + rowH * 0.72);

            let parTot = holesArr ? holesArr.reduce((a, b) => a + b.par, 0) : "-";
            ctx.fillText(parTot, cxTot, scY + headerH + rowH * 1.72);

            let totScore = scoresArr ? scoresArr.reduce((a, b) => a + b, 0) : 0;
            let dispTot = (totScore > 0) ? totScore : "-";
            ctx.fillText(dispTot, cxTot, scY + headerH + rowH * 2.72);
        }

        function drawAnimatedWindSock(poleX, poleTopY, poleBottomY, windSpeed, windAngle) {
            ctx.fillStyle = PALETTE.FAIRWAY_WOOD;
            ctx.fillRect(poleX - 18, poleBottomY - 4, 36, 8);
            ctx.fillStyle = PALETTE.GREEN;
            ctx.fillRect(poleX - 14, poleBottomY - 6, 28, 4);

            ctx.fillStyle = '#888888';
            ctx.fillRect(poleX - 2, poleTopY, 4, poleBottomY - poleTopY);
            ctx.fillStyle = PALETTE.WHITE;
            ctx.fillRect(poleX - 1, poleTopY, 2, poleBottomY - poleTopY);

            ctx.fillStyle = PALETTE.YELLOW;
            ctx.fillRect(poleX - 3, poleTopY - 5, 6, 5);

            const time = Date.now() / 1000;
            const speedNorm = Math.min(1, windSpeed / 30);

            const dirX = Math.cos(windAngle);
            const dirY = Math.sin(windAngle);

            const extension = 0.22 + speedNorm * 0.78;
            const gravitySag = (1 - extension) * 1.15;

            const vecX = dirX * extension;
            const vecY = (dirY * extension) + gravitySag;
            const baseAngle = Math.atan2(vecY, vecX);

            const waveSpeed = 3.5 + speedNorm * 10;
            const waveAmp = 0.04 + speedNorm * 0.14;

            const collarX = poleX + Math.cos(baseAngle) * 7;
            const collarY = (poleTopY + 4) + Math.sin(baseAngle) * 7;

            ctx.strokeStyle = PALETTE.WHITE;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(poleX, poleTopY + 4);
            ctx.lineTo(collarX, collarY);
            ctx.stroke();

            let segX = collarX;
            let segY = collarY;
            const segWidths = [11, 11, 10, 10, 9];
            const segHeights = [14, 12, 10, 8, 6];

            for (let i = 0; i < 5; i++) {
                let flutter = Math.sin(time * waveSpeed - i * 0.85) * waveAmp;
                let curAngle = baseAngle + flutter;
                let w = segWidths[i];
                let h = segHeights[i];

                ctx.save();
                ctx.translate(segX, segY);
                ctx.rotate(curAngle);

                ctx.fillStyle = PALETTE.BLACK;
                ctx.fillRect(-1, -h / 2 - 1, w + 2, h + 2);

                ctx.fillStyle = (i % 2 === 0) ? PALETTE.UI_ORANGE : PALETTE.WHITE;
                ctx.fillRect(0, -h / 2, w, h);

                ctx.restore();

                segX += Math.cos(curAngle) * (w - 1);
                segY += Math.sin(curAngle) * (w - 1);
            }
        }

                    ctx.fillStyle = PALETTE.WATER_SILT; ctx.fillRect(520, 32, 80, 312);
                    ctx.fillStyle = PALETTE.WATER_SILT_LIGHT;
                    let waterOffset = (Date.now() / 300) % 20;
                    for (let wx = 496; wx < 624; wx += 24) {
                        for (let wy = 32; wy < 344; wy += 12) ctx.fillRect(wx + waterOffset, wy + 4, 8, 4);
                    }
                    ctx.restore();
                } else if (currentHole === 2) { 
                    ctx.fillStyle = PALETTE.SAND; ctx.fillRect(80, 100, 50, 110);
                    ctx.fillStyle = PALETTE.SAND_DARK; ctx.fillRect(90, 110, 35, 90);
                }
            }

            const gX = 130, gY = 55, gW = 340, gH = 210;
            if (isNorthern) {
                if (currentHole === 0) {
                    ctx.fillStyle = PALETTE.PEBBLE_BUFFER;
                    ctx.fillRect(gX - 20, gY - 20, gW + 40, gH + 40);
                }
                ctx.fillStyle = PALETTE.FAIRWAY_NORTH;
            } else if (isPrairie) {
                ctx.fillStyle = PALETTE.FAIRWAY_PRAIRIE;
            } else {
                ctx.fillStyle = PALETTE.FAIRWAY_WOOD;
            }
            ctx.fillRect(gX - 12, gY - 12, gW + 24, gH + 24);

            for (let x = gX; x < gX + gW; x += 20) {
                for (let y = gY; y < gY + gH; y += 20) {
                    if (isNorthern) {
                        ctx.fillStyle = ((x + y) / 20) % 2 === 0 ? PALETTE.GREEN_NORTH : PALETTE.GREEN_NORTH_DARK;
                    } else {
                        ctx.fillStyle = ((x + y) / 20) % 2 === 0 ? PALETTE.GREEN : PALETTE.GREEN_DARK;
                    }
                    ctx.fillRect(x, y, 20, 20);
                }
            }

            for (let sx = gX + 35; sx < gX + gW; sx += 55) {
                for (let sy = gY + 35; sy < gY + gH; sy += 45) {
                    let activeSlope = getActiveSlope(sx, sy);
                    let spd = Math.hypot(activeSlope.x, activeSlope.y);
                    if (spd > 0.001) {
                        drawSlopeArrowHead(sx, sy, activeSlope.x, activeSlope.y);
                    }
                }
            }

            ctx.fillStyle = '#08140e'; 
            ctx.fillRect(puttingState.cupX - puttingState.cupRadius - 1, puttingState.cupY - puttingState.cupRadius - 1, (puttingState.cupRadius * 2) + 2, (puttingState.cupRadius * 2) + 2);
            ctx.fillStyle = PALETTE.BLACK; 
            ctx.fillRect(puttingState.cupX - puttingState.cupRadius, puttingState.cupY - puttingState.cupRadius, puttingState.cupRadius * 2, puttingState.cupRadius * 2);
            ctx.fillStyle = '#1e382b'; 
            ctx.fillRect(puttingState.cupX - puttingState.cupRadius + 2, puttingState.cupY - puttingState.cupRadius + 2, 4, 4);

            ctx.fillStyle = PALETTE.WHITE; ctx.fillRect(puttingState.cupX - 1, puttingState.cupY - 32, 3, 32);
            ctx.fillStyle = PALETTE.UI_ORANGE; ctx.fillRect(puttingState.cupX + 2, puttingState.cupY - 32, 12, 10);

            if (state === 'AIM') {
                const dashDistances = [32, 64, 96]; 
                let blinkDash = (Date.now() % 300 < 150) ? PALETTE.WHITE : PALETTE.RED;
                
                for (let i = 0; i < dashDistances.length; i++) {
                    let d = dashDistances[i]; 
                    let dx = ball.x + Math.cos(aimAngle) * d; 
                    let dy = ball.y + Math.sin(aimAngle) * d;
                    
                    ctx.fillStyle = blinkDash; 
                    ctx.fillRect(dx - 3, dy - 1, 6, 2);
                    ctx.fillRect(dx - 1, dy - 3, 2, 6);
                }
            }

            ctx.fillStyle = PALETTE.WHITE; ctx.fillRect(ball.x - 3, ball.y - 3, 6, 6);
        }

        function drawOverlayHUD() {
            const mapX = 12, mapY = 40, mapW = 90, mapH = 130;
            const hole = activeCourseHoles[currentHole];

            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillRect(mapX, mapY, mapW, mapH);
            ctx.strokeStyle = PALETTE.UI_ORANGE; ctx.lineWidth = 2; ctx.strokeRect(mapX, mapY, mapW, mapH);

            ctx.fillStyle = PALETTE.WHITE; ctx.font = '8px "Press Start 2P"'; ctx.textAlign = 'center'; ctx.fillText("MAP", mapX + mapW / 2, mapY + 12);

            let scaleX = (mapW - 16) / hole.worldW; let scaleY = (mapH - 24) / hole.worldH;
            for (let s of hole.shapes) {
                if (s.type === 'HAZARD_ROCK') continue;
                if (s.type === 'FAIRWAY') {
                    ctx.fillStyle = (selectedCourseIdx === 1) ? PALETTE.FAIRWAY_PRAIRIE : (selectedCourseIdx === 2 ? PALETTE.FAIRWAY_NORTH : PALETTE.FAIRWAY_WOOD);
                } else if (s.type === 'PEBBLE_ROUGH') {
                    ctx.fillStyle = PALETTE.PEBBLE_BUFFER;
                } else if (s.type === 'WATER' || s.type === 'WATERFALL') {
                    ctx.fillStyle = (selectedCourseIdx === 1) ? PALETTE.WATER_SILT : (selectedCourseIdx === 2 ? PALETTE.WATER_GLACIAL : PALETTE.WATER_BLUE);
                } else if (s.type === 'MOUNTAIN' || s.type === 'RIDGE') {
                    ctx.fillStyle = PALETTE.MTN_HIGH;
                } else if (s.type === 'SAND') {
                    ctx.fillStyle = (selectedCourseIdx === 2) ? PALETTE.SAND_NORTH : PALETTE.SAND;
                } else if (s.type === 'GREEN') {
                    ctx.fillStyle = (selectedCourseIdx === 2) ? PALETTE.GREEN_NORTH : PALETTE.GREEN;
                } else {
                    ctx.fillStyle = PALETTE[s.type];
                }
                
                ctx.fillRect(mapX + 8 + (s.x * scaleX), mapY + 18 + (s.y * scaleY), Math.max(2, s.w * scaleX), Math.max(2, s.h * scaleY));
            }

            // Pin marker on mini-map
            ctx.fillStyle = (Date.now() % 400 < 200) ? PALETTE.UI_ORANGE : PALETTE.WHITE; 
            ctx.fillRect(mapX + 8 + (hole.pin.x * scaleX) - 2, mapY + 18 + (hole.pin.y * scaleY) - 2, 4, 4);

            // Real ball position marker on mini-map
            ctx.fillStyle = PALETTE.WHITE; 
            ctx.fillRect(mapX + 8 + (ball.x * scaleX) - 2, mapY + 18 + (ball.y * scaleY) - 2, 4, 4);

            // Blinking Projected Shot Tracker on mini-map when ready to shoot
            if (state === 'AIM' && !puttingState.active) {
                let projDist = CLUBS[clubIdx].dist;
                let projX = Math.max(0, Math.min(hole.worldW, ball.x + Math.cos(aimAngle) * projDist));
                let projY = Math.max(0, Math.min(hole.worldH, ball.y + Math.sin(aimAngle) * projDist));
                let mpX = mapX + 8 + (projX * scaleX);
                let mpY = mapY + 18 + (projY * scaleY);

                ctx.fillStyle = (Date.now() % 300 < 150) ? PALETTE.WHITE : PALETTE.RED;
                ctx.fillRect(mpX - 1, mpY - 3, 2, 6);
                ctx.fillRect(mpX - 3, mpY - 1, 6, 2);
            }

            let viewH = 400; ctx.strokeStyle = PALETTE.YELLOW; ctx.lineWidth = 1; ctx.strokeRect(mapX + 8, mapY + 18 + (camY * scaleY), (mapW - 16), viewH * scaleY);

            let windY = mapY + mapH + 5; let windH = 45;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillRect(mapX, windY, mapW, windH);
            ctx.strokeStyle = PALETTE.UI_ORANGE; ctx.lineWidth = 2; ctx.strokeRect(mapX, windY, mapW, windH);
            
            ctx.fillStyle = PALETTE.WHITE; ctx.font = '8px "Press Start 2P"'; ctx.textAlign = 'center';
            ctx.fillText("WIND", mapX + mapW / 2, windY + 12);
            
            ctx.font = '6px "Press Start 2P"'; ctx.fillStyle = PALETTE.YELLOW;
            ctx.fillText(`${sessionConditions.speed} KM/H ${sessionConditions.dirName}`, mapX + mapW / 2, windY + 24);
            
            ctx.save(); ctx.translate(mapX + mapW / 2, windY + 35); ctx.rotate(sessionConditions.dirAngle);
            ctx.strokeStyle = PALETTE.WHITE; ctx.lineWidth = 1.5; ctx.beginPath();
            ctx.moveTo(-4, 0); ctx.lineTo(4, 0); ctx.lineTo(1, -3); ctx.moveTo(4, 0); ctx.lineTo(1, 3); ctx.stroke();
            ctx.restore();

            let scY = windY + windH + 5;
            drawGriddedScorecard(mapX, scY, 116, 60, activeCourseHoles, courseScores, true);
        }

        function drawHUD() {
            let hole = activeCourseHoles[currentHole];

            ctx.fillStyle = PALETTE.BLACK; ctx.fillRect(0, 0, 600, 32);
            ctx.fillStyle = PALETTE.UI_ORANGE; ctx.fillRect(0, 32, 600, 4);
            ctx.fillStyle = PALETTE.BLACK; ctx.fillRect(0, 344, 600, 56);
            ctx.fillStyle = PALETTE.UI_ORANGE; ctx.fillRect(0, 340, 600, 4);

            ctx.fillStyle = PALETTE.WHITE; ctx.font = '10px "Press Start 2P"'; ctx.textAlign = 'left';
            let modeLabel = puttingState.active ? `HOLE ${currentHole + 1} (GREEN)` : `HOLE ${currentHole + 1}`;
            ctx.fillText(`${modeLabel}   PAR ${hole.par}`, 10, 22);

            ctx.textAlign = 'center'; ctx.fillStyle = PALETTE.YELLOW;
            if (!puttingState.active) ctx.fillText(`WIND: ${sessionConditions.speed}KM/H ${sessionConditions.dirName}`, 300, 22);
            else ctx.fillText(`GREEN: ${COURSES[selectedCourseIdx].greens}`, 300, 22);

            ctx.fillStyle = PALETTE.WHITE; ctx.textAlign = 'right';
            let curLie = puttingState.active ? "GREEN" : lie;
            ctx.fillText(`STROKE: ${strokes + (strokes === 0 ? 1 : 0)}  LIE: ${curLie}`, 590, 22);

            let distText = "";
            if (puttingState.active) distText = `PIN: ${(Math.hypot(ball.x - puttingState.cupX, ball.y - puttingState.cupY) / puttingState.zoomScale * 3 / 10).toFixed(1)}ft`;
            else distText = `PIN: ${Math.hypot(ball.x - hole.pin.x, ball.y - hole.pin.y).toFixed(0)}y`;

            ctx.textAlign = 'left';
            let isBadLie = (lie === 'SAND' || lie === 'ROUGH') && clubIdx === 0 && !puttingState.active;
            ctx.fillStyle = isBadLie ? PALETTE.CANYON : PALETTE.WHITE;
            ctx.fillText(`${CLUBS[clubIdx].name}`, 15, 375);
            ctx.fillStyle = PALETTE.WHITE; ctx.fillText(distText, 215, 375);

            const meterX = 350; const meterW = 230;
            ctx.fillStyle = '#222222'; ctx.fillRect(meterX, 360, meterW, 20);
            ctx.fillStyle = '#441111'; ctx.fillRect(meterX, 360, meterW * 0.20, 20);
            ctx.fillStyle = '#666666'; ctx.fillRect(meterX + (meterW * 0.25), 360, 2, 20); ctx.fillRect(meterX + (meterW * 0.50), 360, 2, 20); ctx.fillRect(meterX + (meterW * 0.75), 360, 2, 20);

            let sweetLeft = meterW * 0.20; let sweetW = meterW * 0.10;
            ctx.fillStyle = PALETTE.WHITE; ctx.fillRect(meterX + sweetLeft, 360, sweetW, 20);
            ctx.fillStyle = PALETTE.BLACK; ctx.font = '12px "Press Start 2P"';
            ctx.fillText("[", meterX + sweetLeft - 4, 375); ctx.fillText("]", meterX + sweetLeft + sweetW - 8, 375);

            if (state === 'POWER' || state === 'SNAP' || state === 'FLY' || state === 'ROLL') {
                ctx.fillStyle = PALETTE.UI_ORANGE; ctx.fillRect(meterX, 364, (meter.val / 100) * meterW, 12);
                if (state === 'POWER' || state === 'SNAP') {
                    ctx.fillStyle = PALETTE.WHITE; ctx.fillRect(meterX + (meter.val / 100) * meterW - 2, 356, 4, 28);
                }
            }

            if (meter.powerMarker >= 0) { ctx.fillStyle = PALETTE.UI_ORANGE; ctx.fillRect(meterX + (meter.powerMarker / 100) * meterW - 2, 354, 4, 10); }
            if (meter.accuracyMarker >= 0) { ctx.fillStyle = PALETTE.WATER_BLUE_LIGHT; ctx.fillRect(meterX + (meter.accuracyMarker / 100) * meterW - 2, 376, 4, 10); }

            if ((state === 'FLY' || state === 'ROLL' || shotFeedback === "OFF GREEN!" || shotFeedback === "HAZARD +1" || shotFeedback === "WATER +1" || shotFeedback === "ROCK HAZARD +1") && shotFeedback !== "") {
                ctx.fillStyle = shotFeedback === "GREAT SHOT!" ? PALETTE.YELLOW : shotFeedback === "AVERAGE" ? PALETTE.WHITE : PALETTE.CANYON;
                ctx.font = '10px "Press Start 2P"'; ctx.textAlign = 'center'; ctx.fillText(shotFeedback, meterX + (meterW / 2), 394);
            }
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
