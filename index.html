<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Festival Arcade Mobile</title>
  <style>
    /* Global Reset & Base */
    body { 
      margin: 0; padding: 0; 
      background: #000; 
      color: #fff; 
      font-family: 'Courier New', Courier, monospace; 
      display: flex; justify-content: center; align-items: center;
      height: 100vh; overflow: hidden;
      touch-action: none; 
    }

    /* Main 9:16 Mobile Arcade Cabinet */
    .arcade-machine {
      width: 100%;
      max-width: 450px;
      aspect-ratio: 9/16;
      max-height: 100vh;
      background: #0d0d0d;
      border-radius: 20px;
      border: 4px solid #333;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
      position: relative;
      overflow: hidden;
    }

    /* --- SECTION 1: CRT MONITOR (Angled Away) --- */
    .monitor-bezel {
      flex: 0 0 58%; /* Increased screen space */
      background: linear-gradient(to bottom, #000 0%, #151515 100%);
      padding: 15px 15px 5px 15px; /* Tighter padding to maximize screen */
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      /* Faux 3D inner shadow to simulate the deep monitor housing */
      box-shadow: inset 0 25px 35px rgba(0,0,0,0.9), inset 0 -5px 10px rgba(255,255,255,0.05);
    }

    .crt-screen {
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      border: 6px solid #1a1a1a;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
    }

    /* The DOS Style Menu Overlay */
    #dos-menu {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000;
      color: #33ff33;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .dos-header {
      font-weight: bold;
      margin-bottom: 15px;
      border-bottom: 2px dashed #33ff33;
      padding-bottom: 5px;
    }

    .dos-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dos-list li {
      font-size: 14px;
      text-transform: uppercase;
      opacity: 0.5;
    }

    .dos-list li.active {
      opacity: 1;
      font-weight: bold;
      background: #33ff33;
      color: #000;
    }

    .dos-list li::before {
      content: "  ";
      white-space: pre;
    }

    .dos-list li.active::before {
      content: "> ";
    }

    /* Game iFrame */
    #arcade-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      position: absolute;
      top: 0; left: 0;
      z-index: 5;
    }

    /* CRT Scanline Overlay */
    .crt-screen::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 20;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
    }

    /* --- SECTION 2: CONTROL DECK (Flat & Level) --- */
    .control-deck {
      flex: 0 0 25%;
      /* Gradient simulates flat light hitting the panel */
      background: linear-gradient(to bottom, #2b2b2b 0%, #1a1a1a 15%, #111 100%);
      border-top: 3px solid #666; /* Bright leading edge connecting to monitor */
      border-bottom: 8px solid #000; /* Heavy drop-off lip connecting to front panel */
      box-shadow: 0 15px 25px rgba(0,0,0,0.9); /* Shadows cast down onto the front panel */
      position: relative;
      padding: 0 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 5;
    }

    /* Digital Joystick */
    .joystick-base {
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, #1a1a1a 30%, #2a2a2a 100%);
      border-radius: 50%;
      border: 4px solid #050505;
      box-shadow: inset 0 5px 15px rgba(0,0,0,0.9), 0 2px 5px rgba(255,255,255,0.1);
      position: relative;
    }

    .j-dir {
      position: absolute;
      z-index: 2;
      cursor: pointer;
    }
    .j-up { top: 0; left: 30px; width: 60px; height: 60px; border-radius: 30px 30px 0 0; }
    .j-down { bottom: 0; left: 30px; width: 60px; height: 60px; border-radius: 0 0 30px 30px; }
    .j-left { top: 30px; left: 0; width: 60px; height: 60px; border-radius: 30px 0 0 30px; }
    .j-right { top: 30px; right: 0; width: 60px; height: 60px; border-radius: 0 30px 30px 0; }

    /* The Stick Itself (Larger Ball) */
    .joystick-stick {
      width: 65px; /* Increased from 50px */
      height: 65px;
      background: radial-gradient(circle at 35% 35%, #888, #222);
      border-radius: 50%;
      position: absolute;
      top: 27.5px; left: 27.5px; /* Perfectly centered */
      box-shadow: 8px 12px 15px rgba(0,0,0,0.6), inset -5px -5px 15px rgba(0,0,0,0.7);
      pointer-events: none;
      transition: transform 0.05s ease-out;
      z-index: 1;
    }

    .j-up:active ~ .joystick-stick { transform: translateY(-12px); box-shadow: 8px 25px 15px rgba(0,0,0,0.5), inset -5px -5px 15px rgba(0,0,0,0.7); }
    .j-down:active ~ .joystick-stick { transform: translateY(12px); box-shadow: 8px 0px 15px rgba(0,0,0,0.5), inset -5px -5px 15px rgba(0,0,0,0.7); }
    .j-left:active ~ .joystick-stick { transform: translateX(-12px); box-shadow: 20px 12px 15px rgba(0,0,0,0.5), inset -5px -5px 15px rgba(0,0,0,0.7); }
    .j-right:active ~ .joystick-stick { transform: translateX(12px); box-shadow: -5px 12px 15px rgba(0,0,0,0.5), inset -5px -5px 15px rgba(0,0,0,0.7); }

    /* Concave Action Buttons */
    .action-container {
      display: flex;
      gap: 15px;
      transform: rotate(-15deg); 
    }

    .action-btn-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .action-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 3px solid #111;
      cursor: pointer;
      position: relative;
      box-shadow: inset 0 6px 12px rgba(255,255,255,0.15), inset 0 -8px 15px rgba(0,0,0,0.7), 0 6px 0 #050505, 0 10px 15px rgba(0,0,0,0.6);
    }
    
    .action-btn::after {
      content: '';
      position: absolute;
      top: 4px; left: 10px; right: 10px; height: 18px;
      background: linear-gradient(rgba(255,255,255,0.25), transparent);
      border-radius: 20px 20px 0 0;
      pointer-events: none;
    }

    .action-btn:active {
      transform: translateY(6px);
      box-shadow: inset 0 6px 12px rgba(255,255,255,0.15), inset 0 -8px 15px rgba(0,0,0,0.7), 0 0 0 #050505, 0 4px 6px rgba(0,0,0,0.6);
    }

    .btn-b { background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.4) 0%, transparent 80%), #e0a800; margin-top: 25px; }
    .btn-a { background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.4) 0%, transparent 80%), #cc0000; }

    .btn-label {
      font-size: 12px;
      font-weight: bold;
      color: #777;
    }

    /* --- SECTION 3: FRONT PANEL (Straight Down) --- */
    .front-panel {
      flex: 1; /* Automatically takes the remaining ~17% */
      background: linear-gradient(to bottom, #050505 0%, #111 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 4; /* Sits beneath the control deck shadow */
    }

    /* 90s Coin Insert Plate (Moved to Front Panel) */
    .coin-door {
      background: #1a1a1a;
      border: 3px solid #000;
      border-radius: 6px;
      padding: 10px 15px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 2px 4px rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .coin-btn {
      width: 45px;
      height: 60px;
      background: rgba(230, 60, 20, 0.85);
      border: 3px solid #050505;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: inset 0 0 12px rgba(255,180,100,0.6), inset 0 0 4px rgba(0,0,0,0.8), 0 4px 0 #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .coin-btn:active {
      transform: translateY(4px);
      box-shadow: inset 0 0 12px rgba(255,180,100,0.6), inset 0 0 4px rgba(0,0,0,0.8), 0 0 0 #000;
    }

    .coin-text {
      font-family: Arial, sans-serif;
      font-weight: 900; 
      font-size: 8px;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 0 4px rgba(255,255,255,0.6);
      line-height: 1.2;
    }
  </style>
</head>

    <!-- 1. CRT MONITOR (Angled Back) -->
    <div class="monitor-bezel">
      <div class="crt-screen">
        
        <!-- OS Menu -->
        <div id="dos-menu">
          <div class="dos-header">FESTIVAL_OS.EXE<br>MEM OK...</div>
          <ul class="dos-list" id="game-list">
