<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Electric Buffalo Arcade Machine</title>
  <style>
    /* Arcade Cabinet Body */
    body { 
      margin: 0; padding: 0; 
      background: #050505; 
      color: #00ff00; 
      font-family: 'Courier New', Courier, monospace; 
      display: flex; flex-direction: column; 
      height: 100vh; overflow: hidden;
    }

    /* Header / Marquee */
    .marquee {
      text-align: center;
      padding: 15px 10px;
      background: #111;
      border-bottom: 4px solid #333;
      text-shadow: 0 0 10px #00ff00;
      letter-spacing: 2px;
      font-weight: bold;
      font-size: 20px;
    }

    /* SNES-Style Icon Scroller */
    .scroller-container {
      padding: 20px 10px;
      background: #1a1a1a;
      border-bottom: 4px solid #00ff00;
      box-shadow: 0 4px 15px rgba(0, 255, 0, 0.2);
      z-index: 10;
    }
    
    .scroller {
      display: flex; 
      gap: 15px; 
      overflow-x: auto; 
      padding-bottom: 10px;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      scrollbar-color: #00ff00 #111;
    }

    /* Hide standard webkit scrollbar for a cleaner look */
    .scroller::-webkit-scrollbar { height: 8px; }
    .scroller::-webkit-scrollbar-track { background: #111; }
    .scroller::-webkit-scrollbar-thumb { background: #00ff00; border-radius: 4px; }

    .game-card {
      flex: 0 0 140px; 
      height: 100px;
      background: #000; 
      border: 3px solid #333; 
      border-radius: 8px;
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center;
      cursor: pointer; 
      transition: all 0.2s ease-in-out;
      scroll-snap-align: center;
      color: #aaa;
      text-transform: uppercase;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
    }

    /* Active & Hover States for Game Cards */
    .game-card:hover, .game-card.active {
      transform: scale(1.05);
      border-color: #00ff00;
      color: #00ff00;
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
      background: #111;
    }
    
    .card-icon { font-size: 30px; margin-bottom: 8px; }

    /* The CRT Screen Container */
    .screen-wrapper {
      flex: 1;
      position: relative;
      background: #000;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .crt-monitor {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 3/4; /* Matches your mini-game dimensions */
      max-height: 100%;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 0 20px rgba(0,255,0,0.1);
      border: 8px solid #222;
      background: #050505;
    }

    iframe {
      width: 100%; 
      height: 100%; 
      border: none;
      display: block;
    }

    /* CRT Scanline & Glow Overlay */
    .crt-monitor::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 2;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none; /* Critical: allows clicks to pass through to the iframe */
      box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>

  <div class="marquee">INSERT COIN // SELECT GAME</div>

  <div class="scroller-container">
    <div class="scroller" id="game-menu">
      
      <!-- Game 1 -->
      <div class="game-card active" onclick="loadGame('game1.html', this)">
        <div class="card-icon">👾</div>
        <div>Game 1</div>
      </div>
      
      <!-- Game 2 -->
      <div class="game-card" onclick="loadGame('game2.html', this)">
        <div class="card-icon">🕹️</div>
        <div>Game 2</div>
      </div>
      
      <!-- Game 3 -->
      <div class="game-card" onclick="loadGame('game3.html', this)">
        <div class="card-icon">🏎️</div>
        <div>Game 3</div>
      </div>
      
      <!-- Game 4 -->
      <div class="game-card" onclick="loadGame('game4.html', this)">
        <div class="card-icon">🎯</div>
        <div>Game 4</div>
      </div>
      
      <!-- Game 5 -->
      <div class="game-card" onclick="loadGame('game5.html', this)">
        <div class="card-icon">🧩</div>
        <div>Game 5</div>
      </div>
      
      <!-- Game 6 -->
      <div class="game-card" onclick="loadGame('game6.html', this)">
        <div class="card-icon">🥋</div>
        <div>Game 6</div>
      </div>
      
      <!-- Game 7 -->
      <div class="game-card" onclick="loadGame('game7.html', this)">
        <div class="card-icon">🛸</div>
        <div>Game 7</div>
      </div>

    </div>
  </div>

  <div class="screen-wrapper">
    <div class="crt-monitor">
      <iframe id="arcade-screen" src="game1.html" title="Arcade Screen"></iframe>
    </div>
  </div>

  <script>
    function loadGame(url, cardElement) {
      // 1. Change the iframe source
      document.getElementById('arcade-screen').src = url;
      
      // 2. Remove 'active' class from all cards
      const cards = document.querySelectorAll('.game-card');
      cards.forEach(card => card.classList.remove('active'));
      
      // 3. Add 'active' class to the clicked card
      cardElement.classList.add('active');
      
      // 4. Smooth scroll the menu so the selected game is centered
      cardElement.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  </script>

</body>
</html>
