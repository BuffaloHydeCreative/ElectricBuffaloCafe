<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Electric Buffalo Cafe</title>
  <style>
    /* Global Reset & Base */
    body { 
      margin: 0; padding: 0; 
      background: #000; 
      color: #fff; 
      font-family: 'Courier New', Courier, monospace; 
      display: flex; justify-content: center; align-items: center;
      height: 100vh; width: 100vw;
      overflow: hidden;
      touch-action: none; 
    }

    /* Main Mobile Arcade Cabinet */
    .arcade-machine {
      width: 100%;
      max-width: 450px;
      height: 100%;
      max-height: 100vh;
      background: #0d0d0d;
      border-radius: 20px;
      border: 4px solid #333;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* --- SECTION 1: CRT MONITOR (Dynamic Flex Height) --- */
    .monitor-bezel {
      flex: 1;
      min-height: 250px; 
      background: linear-gradient(to bottom, #000 0%, #151515 100%);
      padding: 15px 15px 5px 15px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: inset 0 25px 35px rgba(0,0,0,0.9), inset 0 -5px 10px rgba(255,255,255,0.05);
    }

    .crt-screen {
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      border: 6px solid #1a1a1a;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
    }

    /* The DOS Style Menu Overlay */
    #dos-menu {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000;
      color: #33ff33;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .dos-header {
      font-weight: bold;
      margin-bottom: 15px;
      border-bottom: 2px dashed #33ff33;
      padding-bottom: 5px;
    }

    .dos-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dos-list li {
      font-size: 14px;
      text-transform: uppercase;
      opacity: 0.5;
    }

    .dos-list li.active {
      opacity: 1;
      font-weight: bold;
      background: #33ff33;
      color: #000;
    }

    .dos-list li::before {
      content: "  ";
      white-space: pre;
    }

    .dos-list li.active::before {
      content: "> ";
    }

    /* Game iFrame */
    #arcade-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      position: absolute;
      top: 0; left: 0;
      z-index: 5;
    }

    /* CRT Scanline Overlay */
    .crt-screen::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 20;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
    }

    /* --- SECTION 2: CONTROL DECK (Fixed Height) --- */
    .control-deck {
      flex: 0 0 160px;
      background: linear-gradient(to bottom, #2b2b2b 0%, #1a1a1a 15%, #111 100%);
      border-top: 3px solid #666; 
      border-bottom: 8px solid #000; 
      box-shadow: 0 15px 25px rgba(0,0,0,0.9); 
      position: relative;
      padding: 0 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 5;
      box-sizing: border-box;
    }

    /* Analog-Style Drag Joystick */
    .joystick-base {
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, #1a1a1a 30%, #2a2a2a 100%);
      border-radius: 50%;
      border: 4px solid #050505;
      box-shadow: inset 0 5px 15px rgba(0,0,0,0.9), 0 2px 5px rgba(255,255,255,0.1);
      position: relative;
      touch-action: none; /* Prevents scrolling while dragging */
      cursor: grab;
    }

    .joystick-base:active {
      cursor: grabbing;
    }

    /* The Stick Itself */
    .joystick-stick {
      width: 65px; 
      height: 65px;
      background: radial-gradient(circle at 35% 35%, #888, #222);
      border-radius: 50%;
      position: absolute;
      top: 27.5px; left: 27.5px; 
      box-shadow: 8px 12px 15px rgba(0,0,0,0.6), inset -5px -5px 15px rgba(0,0,0,0.7);
      pointer-events: none; /* Allows base to catch all drag events */
      transition: transform 0.15s ease-out; /* Smooth snap back */
      z-index: 1;
    }

    .joystick-stick.dragging {
      transition: none; /* Instantly follow finger/mouse */
    }

    /* Concave Action Buttons */
    .action-container {
      display: flex;
      gap: 15px;
      transform: rotate(-15deg); 
    }

    .action-btn-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .action-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 3px solid #111;
      cursor: pointer;
      position: relative;
      box-shadow: inset 0 6px 12px rgba(255,255,255,0.15), inset 0 -8px 15px rgba(0,0,0,0.7), 0 6px 0 #050505, 0 10px 15px rgba(0,0,0,0.6);
      touch-action: none;
    }
    
    .action-btn::after {
      content: '';
      position: absolute;
      top: 4px; left: 10px; right: 10px; height: 18px;
      background: linear-gradient(rgba(255,255,255,0.25), transparent);
      border-radius: 20px 20px 0 0;
      pointer-events: none;
    }

    .action-btn:active, .action-btn.active-press {
      transform: translateY(6px);
      box-shadow: inset 0 6px 12px rgba(255,255,255,0.15), inset 0 -8px 15px rgba(0,0,0,0.7), 0 0 0 #050505, 0 4px 6px rgba(0,0,0,0.6);
    }

    .btn-b { background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.4) 0%, transparent 80%), #e0a800; margin-top: 25px; }
    .btn-a { background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.4) 0%, transparent 80%), #cc0000; }

    .btn-label {
      font-size: 12px;
      font-weight: bold;
      color: #777;
    }

    /* --- SECTION 3: FRONT PANEL (Fixed Height) --- */
    .front-panel {
      flex: 0 0 90px;
      background: linear-gradient(to bottom, #050505 0%, #111 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 4; 
    }

    /* 90s Coin Insert Plate */
    .coin-door {
      background: #1a1a1a;
      border: 2px solid #000;
      border-radius: 3px;
      padding: 5px 10px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 2px 4px rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .coin-btn {
      width: 22px;
      height: 30px;
      background: rgba(230, 60, 20, 0.85);
      border: 2px solid #050505;
      border-radius: 3px;
      cursor: pointer;
      box-shadow: inset 0 0 6px rgba(255,180,100,0.6), inset 0 0 2px rgba(0,0,0,0.8), 0 2px 0 #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      touch-action: none;
    }

    .coin-btn:active {
      transform: translateY(4px);
      box-shadow: inset 0 0 6px rgba(255,180,100,0.6), inset 0 0 2px rgba(0,0,0,0.8), 0 0 0 #000;
    }

    .coin-text {
      font-family: Arial, sans-serif;
      font-weight: 600; 
      font-size: 5px;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 0 2px rgba(255,255,255,0.6);
      line-height: 1.2;
    }
  </style>
</head>
<body>

  <div class="arcade-machine">
    
    <!-- 1. CRT MONITOR -->
    <div class="monitor-bezel">
      <div class="crt-screen">
        <div id="dos-menu">
          <div class="dos-header">ElectricBuffalo.EXE<br>RAM OK...</div>
          <ul class="dos-list" id="game-list">
            <li class="active">Red River Run.html</li>
            <li>La Grande Gigue.html</li>
            <li>li rassad di fleur.html</li>
            <li>game4.html</li>
            <li>game5.html</li>
            <li>game6.html</li>
            <li>game7.html</li>
          </ul>
        </div>
        <iframe id="arcade-frame" title="Game Screen"></iframe>
      </div>
    </div>

    <!-- 2. CONTROL DECK -->
    <div class="control-deck">
      
      <!-- Drag/Swipe Joystick -->
      <div class="joystick-base" id="joystick-base">
        <div class="joystick-stick" id="joystick-stick"></div>
      </div>

      <!-- Action Buttons -->
      <div class="action-container">
        <div class="action-btn-wrapper">
          <div class="action-btn btn-b" onmousedown="btnAction('BUTTON_B')" ontouchstart="preventGhostClick(event, 'BUTTON_B')"></div>
          <span class="btn-label">B</span>
        </div>
        <div class="action-btn-wrapper">
          <div class="action-btn btn-a" onmousedown="btnAction('BUTTON_A')" ontouchstart="preventGhostClick(event, 'BUTTON_A')"></div>
          <span class="btn-label">A</span>
        </div>
      </div>
    </div>

    <!-- 3. FRONT PANEL -->
    <div class="front-panel">
      <div class="coin-door">
        <div class="coin-btn" onmousedown="btnHome()" ontouchstart="preventGhostClick(event, 'HOME')">
          <span class="coin-text">INSERT<br>COIN</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    let currentIndex = 0;
    const games = [
      'game1.html', 'game2.html', 'game3.html', 
      'game4.html', 'game5.html', 'game6.html', 'game7.html'
    ];
    let isPlaying = false;

    const listItems = document.querySelectorAll('#game-list li');
    const dosMenu = document.getElementById('dos-menu');
    const gameFrame = document.getElementById('arcade-frame');

    function sendSignal(command) {
      if (isPlaying) {
        gameFrame.contentWindow.postMessage(command, '*');
      }
    }

    // Single trigger action mapping to stop ghost clicks
    function preventGhostClick(e, actionType) {
      e.preventDefault(); 
      if (actionType === 'BUTTON_A' || actionType === 'BUTTON_B') {
        btnAction(actionType);
        // Visual press state
        e.target.classList.add('active-press');
        setTimeout(() => e.target.classList.remove('active-press'), 150);
      } else if (actionType === 'HOME') {
        btnHome();
      }
    }

    function pressDpad(directionStr) {
      if (isPlaying) {
        sendSignal(directionStr);
      } else {
        if (directionStr === 'DPAD_UP') moveMenu(-1);
        if (directionStr === 'DPAD_DOWN') moveMenu(1);
      }
    }

    function moveMenu(direction) {
      listItems[currentIndex].classList.remove('active');
      currentIndex += direction;
      if (currentIndex < 0) currentIndex = games.length - 1;
      if (currentIndex >= games.length) currentIndex = 0;
      listItems[currentIndex].classList.add('active');
    }

    function btnAction(buttonStr) {
      if (isPlaying) {
        sendSignal(buttonStr);
      } else {
        if (buttonStr === 'BUTTON_A') {
          dosMenu.style.display = 'none';
          gameFrame.style.display = 'block';
          gameFrame.src = games[currentIndex];
          isPlaying = true;
        }
      }
    }

    function btnHome() {
      if (isPlaying) {
        gameFrame.src = ""; 
        gameFrame.style.display = 'none';
        dosMenu.style.display = 'flex';
        isPlaying = false;
      }
    }

    /* --- ADVANCED JOYSTICK DRAG LOGIC --- */
    const joyBase = document.getElementById('joystick-base');
    const joyStick = document.getElementById('joystick-stick');
    
    let isDragging = false;
    let currentDir = null;
    const maxRadius = 35; // Maximum visual travel of the stick
    const deadzone = 15;  // Minimum pixels required to trigger a direction

    function startDrag(e) {
      e.preventDefault();
      isDragging = true;
      joyStick.classList.add('dragging');
      moveDrag(e);
    }

    function moveDrag(e) {
      if (!isDragging) return;
      e.preventDefault();

      const rect = joyBase.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let clientX, clientY;
      if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      const dx = clientX - centerX;
      const dy = clientY - centerY;
      const distance = Math.sqrt(dx * dx + dy * dy);

      // Clamp visual stick rendering to the max radius
      let stickX = dx;
      let stickY = dy;
      if (distance > maxRadius) {
        const angle = Math.atan2(dy, dx);
        stickX = Math.cos(angle) * maxRadius;
        stickY = Math.sin(angle) * maxRadius;
      }

      joyStick.style.transform = `translate(${stickX}px, ${stickY}px)`;

      // Logic translation: determine dominant 4-way direction
      let newDir = null;
      if (distance > deadzone) {
        if (Math.abs(dx) > Math.abs(dy)) {
          newDir = dx > 0 ? 'DPAD_RIGHT' : 'DPAD_LEFT';
        } else {
          newDir = dy > 0 ? 'DPAD_DOWN' : 'DPAD_UP';
        }
      }

      // Only trigger input if direction state changes
      if (newDir !== currentDir) {
        currentDir = newDir;
        if (currentDir) {
          pressDpad(currentDir);
        }
      }
    }

    function endDrag(e) {
      if (e) e.preventDefault();
      if (!isDragging) return;
      isDragging = false;
      currentDir = null;
      joyStick.classList.remove('dragging');
      joyStick.style.transform = `translate(0px, 0px)`; // Snap back to center
    }

    // Attach dragging events (Window listeners ensure tracking if finger slips off base)
    joyBase.addEventListener('mousedown', startDrag);
    joyBase.addEventListener('touchstart', startDrag, { passive: false });

    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('touchmove', moveDrag, { passive: false });

    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchend', endDrag);

  </script>

</body>
</html>
