<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bwaa Brule</title>
  <style>
    /* Global Reset & Base */
    body { 
      margin: 0; padding: 0; 
      background: #000; 
      color: #fff; 
      font-family: 'Courier New', Courier, monospace; 
      display: flex; justify-content: center; align-items: center;
      height: 100vh; width: 100vw;
      overflow: hidden;
      touch-action: none; 
    }

    /* Main Mobile Arcade Cabinet */
    .arcade-machine {
      width: 100%;
      max-width: 450px;
      height: 100%;
      max-height: 100vh;
      background: #0d0d0d;
      border-radius: 20px;
      border: 4px solid #333;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* --- SECTION 1: CRT MONITOR --- */
    .monitor-bezel {
      flex: 1;
      min-height: 250px; 
      background: linear-gradient(to bottom, #000 0%, #151515 100%);
      padding: 15px 15px 5px 15px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: inset 0 25px 35px rgba(0,0,0,0.9), inset 0 -5px 10px rgba(255,255,255,0.05);
    }

    .crt-screen {
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      border: 6px solid #1a1a1a;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
    }

    .screen-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      box-sizing: border-box;
      display: none; 
    }

    #boot-splash {
      background: #000;
      z-index: 15;
      display: flex; 
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #introCanvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated; 
      z-index: 2;
    }

    #static-splash {
      background: #000;
      z-index: 14;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #bwaaCanvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated; 
      z-index: 2;
    }

    #dos-menu {
      background: #000;
      color: #12AEA2;
      padding: 20px;
      flex-direction: column;
      z-index: 10;
    }

    .dos-header {
      font-weight: bold;
      margin-bottom: 15px;
      border-bottom: 2px dashed #12AEA2;
      padding-bottom: 5px;
    }

    .dos-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dos-list li {
      font-size: 14px;
      text-transform: uppercase;
      opacity: 0.5;
    }

    .dos-list li.active {
      opacity: 1;
      font-weight: bold;
      background: #12AEA2;
      color: #000;
    }

    .dos-list li::before {
      content: "  ";
      white-space: pre;
    }

    .dos-list li.active::before {
      content: "> ";
    }

    #arcade-frame {
      width: 100%;
      height: 100%;
      border: none;
      z-index: 5;
    }

    .crt-screen::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 20;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
    }

    /* --- SECTION 2: CONTROL DECK --- */
    .control-deck {
      flex: 0 0 160px;
      background: linear-gradient(to bottom, #2b2b2b 0%, #1a1a1a 15%, #111 100%);
      border-top: 3px solid #666; 
      border-bottom: 8px solid #000; 
      box-shadow: 0 15px 25px rgba(0,0,0,0.9); 
      position: relative;
      padding: 0 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 5;
      box-sizing: border-box;
    }

    .joystick-base {
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, #1a1a1a 30%, #2a2a2a 100%);
      border-radius: 50%;
      border: 4px solid #050505;
      box-shadow: inset 0 5px 15px rgba(0,0,0,0.9), 0 2px 5px rgba(255,255,255,0.1);
      position: relative;
      touch-action: none; 
      cursor: grab;
    }

    .joystick-base:active {
      cursor: grabbing;
    }

    .joystick-stick {
      width: 65px; 
      height: 65px;
      background: radial-gradient(circle at 35% 35%, #888, #222);
      border-radius: 50%;
      position: absolute;
      top: 27.5px; left: 27.5px; 
      box-shadow: 8px 12px 15px rgba(0,0,0,0.6), inset -5px -5px 15px rgba(0,0,0,0.7);
      pointer-events: none; 
      transition: transform 0.15s ease-out; 
      z-index: 1;
    }

    .joystick-stick.dragging {
      transition: none; 
    }

    .action-container {
      display: flex;
      gap: 15px;
      transform: rotate(-15deg); 
    }

    .action-btn-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .action-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 3px solid #111;
      cursor: pointer;
      position: relative;
      box-shadow: inset 0 6px 12px rgba(255,255,255,0.15), inset 0 -8px 15px rgba(0,0,0,0.7), 0 6px 0 #050505, 0 10px 15px rgba(0,0,0,0.6);
      touch-action: none;
    }
    
    .action-btn::after {
      content: '';
      position: absolute;
      top: 4px; left: 10px; right: 10px; height: 18px;
      background: linear-gradient(rgba(255,255,255,0.25), transparent);
      border-radius: 20px 20px 0 0;
      pointer-events: none;
    }

    .action-btn:active, .action-btn.active-press {
      transform: translateY(6px);
      box-shadow: inset 0 6px 12px rgba(255,255,255,0.15), inset 0 -8px 15px rgba(0,0,0,0.7), 0 0 0 #050505, 0 4px 6px rgba(0,0,0,0.6);
    }

    .btn-b { background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.4) 0%, transparent 80%), #AD1C21; margin-top: 25px; }
    .btn-a { background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.4) 0%, transparent 80%), #12AEA2; }

    .btn-label {
      font-size: 12px;
      font-weight: bold;
      color: #777;
    }

    /* --- SECTION 3: FRONT PANEL --- */
    .front-panel {
      flex: 0 0 90px;
      background: linear-gradient(to bottom, #050505 0%, #111 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 4; 
    }

    .home-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .home-btn {
      width: 45px;
      height: 20px;
      background: #333;
      border-radius: 10px;
      border: 2px solid #111;
      cursor: pointer;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.05), 0 4px 0 #000;
      touch-action: none;
    }

    .home-btn:active {
      transform: translateY(4px);
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.05), 0 0 0 #000;
    }

    .home-label {
      font-size: 10px;
      font-weight: bold;
      color: #666;
      letter-spacing: 1px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <div class="arcade-machine">
    <div class="monitor-bezel">
      <div class="crt-screen">
        
        <div id="boot-splash" class="screen-layer">
          <canvas id="introCanvas" width="600" height="450"></canvas>
        </div>

        <div id="static-splash" class="screen-layer">
          <canvas id="bwaaCanvas" width="600" height="450"></canvas>
        </div>

        <div id="dos-menu" class="screen-layer">
          <div class="dos-header">Bwaa_Brule.EXE<br>RAM OK...</div>
          <ul class="dos-list" id="game-list">
            <li class="active">Red River Run.html</li>
            <li>La Grande Gigue.html</li>
            <li>li rassad di fleur.html</li>
            <li>Sîsîp.html</li>
            <li>Land Thunder!.html</li>
            <li>Bonami!.html</li>
            <li>game7.html</li>
          </ul>
        </div>

        <iframe id="arcade-frame" class="screen-layer" title="Game Screen"></iframe>

      </div>
    </div>

    <div class="control-deck">
      <div class="joystick-base" id="joystick-base">
        <div class="joystick-stick" id="joystick-stick"></div>
      </div>
      <div class="action-container">
        <div class="action-btn-wrapper">
          <div class="action-btn btn-b" onmousedown="btnAction('BUTTON_B')" ontouchstart="preventGhostClick(event, 'BUTTON_B')"></div>
          <span class="btn-label">B</span>
        </div>
        <div class="action-btn-wrapper">
          <div class="action-btn btn-a" onmousedown="btnAction('BUTTON_A')" ontouchstart="preventGhostClick(event, 'BUTTON_A')"></div>
          <span class="btn-label">A</span>
        </div>
      </div>
    </div>

    <div class="front-panel">
      <div class="home-container">
        <div class="home-btn" onmousedown="btnHome()" ontouchstart="preventGhostClick(event, 'HOME')"></div>
        <span class="home-label">HOME</span>
      </div>
    </div>
  </div>

  <script>
    let machineState = 'BOOT';
    let currentIndex = 0;
    const games = [
      'game1.html', 'game2.html', 'game3.html', 
      'game4.html', 'game5.html', 'game6.html', 'game7.html'
    ];
    let isPlaying = false;

    const bootSplash = document.getElementById('boot-splash');
    const staticSplash = document.getElementById('static-splash');
    const dosMenu = document.getElementById('dos-menu');
    const gameFrame = document.getElementById('arcade-frame');
    const listItems = document.querySelectorAll('#game-list li');

    let staticStartTime = 0;

    function transitionToStatic() {
      machineState = 'STATIC';
      bootSplash.style.display = 'none';
      staticSplash.style.display = 'flex';
      staticStartTime = performance.now();
      requestAnimationFrame(staticLoop);
    }

    function sendSignal(command) {
      if (isPlaying) gameFrame.contentWindow.postMessage(command, '*');
    }

    function preventGhostClick(e, actionType) {
      e.preventDefault(); 
      if (actionType === 'BUTTON_A' || actionType === 'BUTTON_B') {
        btnAction(actionType);
        e.target.classList.add('active-press');
        setTimeout(() => e.target.classList.remove('active-press'), 150);
      } else if (actionType === 'HOME') {
        btnHome();
      }
    }

    function pressDpad(directionStr) {
      if (machineState === 'PLAYING') {
        sendSignal(directionStr);
      } else if (machineState === 'MENU') {
        if (directionStr === 'DPAD_UP') moveMenu(-1);
        if (directionStr === 'DPAD_DOWN') moveMenu(1);
      }
    }

    function moveMenu(direction) {
      listItems[currentIndex].classList.remove('active');
      currentIndex += direction;
      if (currentIndex < 0) currentIndex = games.length - 1;
      if (currentIndex >= games.length) currentIndex = 0;
      listItems[currentIndex].classList.add('active');
    }

    function btnAction(buttonStr) {
      if (machineState === 'PLAYING') {
        sendSignal(buttonStr);
      } else if (machineState === 'STATIC' && buttonStr === 'BUTTON_A') {
        machineState = 'MENU';
        staticSplash.style.display = 'none';
        dosMenu.style.display = 'flex';
      } else if (machineState === 'MENU' && buttonStr === 'BUTTON_A') {
        machineState = 'PLAYING';
        dosMenu.style.display = 'none';
        gameFrame.style.display = 'block';
        gameFrame.src = games[currentIndex];
        isPlaying = true;
      }
    }

    function btnHome() {
      if (machineState === 'PLAYING' || machineState === 'MENU') {
        gameFrame.src = ""; 
        gameFrame.style.display = 'none';
        dosMenu.style.display = 'none';
        machineState = 'STATIC';
        staticSplash.style.display = 'flex';
        isPlaying = false;
        staticStartTime = performance.now();
        requestAnimationFrame(staticLoop);
      }
    }

    const joyBase = document.getElementById('joystick-base');
    const joyStick = document.getElementById('joystick-stick');
    let isDragging = false;
    let currentDir = null;
    const maxRadius = 35; 
    const deadzone = 15;  

    let holdTimer = null;
    let repeatInterval = null;

    function startSendingDirection(dir) {
      stopSendingDirection();
      pressDpad(dir); 
      holdTimer = setTimeout(() => {
        repeatInterval = setInterval(() => { pressDpad(dir); }, 100); 
      }, 300);
    }

    function stopSendingDirection() {
      if (holdTimer) clearTimeout(holdTimer);
      if (repeatInterval) clearInterval(repeatInterval);
      holdTimer = null;
      repeatInterval = null;
    }

    function startDrag(e) {
      e.preventDefault();
      isDragging = true;
      joyStick.classList.add('dragging');
      moveDrag(e);
    }

    function moveDrag(e) {
      if (!isDragging) return;
      e.preventDefault();

      const rect = joyBase.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let clientX, clientY;
      if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      const dx = clientX - centerX;
      const dy = clientY - centerY;
      const distance = Math.sqrt(dx * dx + dy * dy);

      let stickX = dx;
      let stickY = dy;
      if (distance > maxRadius) {
        const angle = Math.atan2(dy, dx);
        stickX = Math.cos(angle) * maxRadius;
        stickY = Math.sin(angle) * maxRadius;
      }

      joyStick.style.transform = `translate(${stickX}px, ${stickY}px)`;

      let newDir = null;
      if (distance > deadzone) {
        if (Math.abs(dx) > Math.abs(dy)) {
          newDir = dx > 0 ? 'DPAD_RIGHT' : 'DPAD_LEFT';
        } else {
          newDir = dy > 0 ? 'DPAD_DOWN' : 'DPAD_UP';
        }
      }

      if (newDir !== currentDir) {
        currentDir = newDir;
        if (currentDir) startSendingDirection(currentDir);
        else stopSendingDirection();
      }
    }

    function endDrag(e) {
      if (e) e.preventDefault();
      if (!isDragging) return;
      isDragging = false;
      currentDir = null;
      stopSendingDirection(); 
      joyStick.classList.remove('dragging');
      joyStick.style.transform = `translate(0px, 0px)`;
    }

    joyBase.addEventListener('mousedown', startDrag);
    joyBase.addEventListener('touchstart', startDrag, { passive: false });
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('touchmove', moveDrag, { passive: false });
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchend', endDrag);

    function drawMatrix(context, matrix, palette, startX, startY, pixelSize, alpha = 1.0) {
        context.globalAlpha = alpha;
        for (let y = 0; y < matrix.length; y++) {
            for (let x = 0; x < matrix[y].length; x++) {
                const colorCode = matrix[y][x];
                if (colorCode !== '0' && palette[colorCode]) {
                    context.fillStyle = palette[colorCode];
                    context.fillRect(startX + (x * pixelSize), startY + (y * pixelSize), pixelSize, pixelSize);
                }
            }
        }
        context.globalAlpha = 1.0;
    }

    /* --- BWAA BRULE STACKED ANIMATION (STATIC SPLASH) --- */
    const BWAA_PALETTE = {
        '0': null,
        '1': '#540E11', // Deep Bordeaux Border 
        '2': '#ffffff'  // Solid White Stencil Fill
    };

    // Center stacked 2D array matrix matching the thick arcade spelling specs
    const BWAA_SPRITE = [
        "000001111110000110000110000011110000001111000000",
        "000012222221001221001221000122221000012222100000",
        "000012211221001221001221001221122100122112210000",
        "000012222210001221001221001222222100122222210000",
        "000012211221001221111221001221122100122112210000",
        "000012211221001222222221001221122100122112210000",
        "000012222221000122112210001221122100122112210000",
        "000001111110000011001100000110011000011001100000",
        "000000000000000000000000000000000000000000000000",
        "000000000000000000000000000000000000000000000000",
        "011111100001111110000110011000011000000001111110",
        "122222210012222221001221122100122100000012222221",
        "122112210012211221001221122100122100000012210000",
        "122222100012222210001221122100122100000012222100",
        "122112210012211221001221122100122100000012210000",
        "122112210012211221001221122100122111100012211110",
        "122222210012211221000122221000122222210012222221",
        "011111100001100110000011110000011111100001111110"
    ];

    const sCanvas = document.getElementById('bwaaCanvas');
    const sCtx = sCanvas.getContext('2d');
    sCtx.imageSmoothingEnabled = false;

    function staticLoop(timestamp) {
        if (machineState !== 'STATIC') return;

        sCtx.fillStyle = '#000000';
        sCtx.fillRect(0, 0, sCanvas.width, sCanvas.height);

        const elapsed = (timestamp - staticStartTime) / 1000;
        const zoomDuration = 4.0; 
        let currentScale;

        // Cinematic zoom into resting place
        if (elapsed < zoomDuration) {
            const t = elapsed / zoomDuration;
            const easeOut = 1 - Math.pow(1 - t, 3);
            currentScale = 0.5 + (1.2 - 0.5) * easeOut; // Scales up gently to max size
        } else {
            currentScale = 1.2; 
        }

        sCtx.save();
        // Central positioning with slight vertical offset above the prompt
        sCtx.translate(sCanvas.width / 2, sCanvas.height / 2 - 30);
        sCtx.scale(currentScale, currentScale);

        const pSize = 5; 
        const spriteW = BWAA_SPRITE[0].length * pSize;
        const spriteH = BWAA_SPRITE.length * pSize;
        
        drawMatrix(sCtx, BWAA_SPRITE, BWAA_PALETTE, -spriteW/2, -spriteH/2, pSize);
        sCtx.restore();

        // Lock text appearance exclusively until AFTER animation finishes computing frames
        if (elapsed >= zoomDuration) {
            const blink = Math.floor(timestamp / 500) % 2 === 0;
            if (blink) {
                sCtx.fillStyle = '#12AEA2'; 
                sCtx.font = 'bold 24px "Courier New"';
                sCtx.textAlign = 'center';
                sCtx.fillText("PRESS A TO START", sCanvas.width / 2, sCanvas.height - 30);
            }
        }

        requestAnimationFrame(staticLoop);
    }

    /* --- ANIMATED BOOT SPLASH LOGIC (BUFFALOHYDE) --- */
    const canvas = document.getElementById('introCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const PALETTE = {
        '0': null, 
        '1': '#1e1b18', 
        '2': '#dcd7c9', 
        '3': '#c7f1ef', 
        '4': '#AD1C21', 
        '5': '#F7C844', 
        '6': '#ffffff'  
    };

    const BUFFALO_SPRITE = [
      "0000000011100000",
      "0000000111120000",
      "0000011111121000",
      "0000111111111000",
      "0001111111111000",
      "0001111111111000",
      "0001111111133000",
      "0001111111130000",
      "0000111111100000",
      "0000100100100000",
      "0000100100100000"
    ];

    let splashState = 'WAITING'; 
    let animStartTime = 0;
    let audioCtx = null;

    window.addEventListener('click', () => {
        if (machineState === 'BOOT' && splashState === 'WAITING') {
            initAudio();
            playKaChing();
            splashState = 'PLAYING';
            animStartTime = performance.now();
        }
    });

    window.addEventListener('touchstart', () => {
        if (machineState === 'BOOT' && splashState === 'WAITING') {
            initAudio();
            playKaChing();
            splashState = 'PLAYING';
            animStartTime = performance.now();
        }
    }, {passive: true});

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playKaChing() {
        if (!audioCtx) return;
        playTone(987.77, 0, 0.1, 'square');
        playTone(1318.51, 0.1, 0.6, 'sine');
    }

    function playTone(frequency, delay, duration, type) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime + delay);
        gain.gain.setValueAtTime(0, audioCtx.currentTime + delay);
        gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + delay + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + duration);
    }

    function drawSparkle(x, y, scale, rotation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.scale(scale, scale);
        ctx.fillStyle = PALETTE['5']; 
        ctx.fillRect(-2, -10, 4, 20);
        ctx.fillRect(-10, -2, 20, 4);
        ctx.fillStyle = PALETTE['6']; 
        ctx.fillRect(-1, -1, 2, 2);
        ctx.restore();
    }

    function bootLoop(timestamp) {
        if (machineState !== 'BOOT') return;
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (splashState === 'WAITING') {
            const blink = Math.floor(timestamp / 500) % 2 === 0;
            if (blink) {
                ctx.fillStyle = '#12AEA2';
                ctx.font = 'bold 24px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText("POWER ON", canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = '16px "Courier New"';
                ctx.fillText("(TAP ANYWHERE TO START)", canvas.width / 2, canvas.height / 2 + 25);
            }
        } 
        else if (splashState === 'PLAYING') {
            const elapsed = (timestamp - animStartTime) / 1000; 
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 - 40; 
            
            let currentScale = 0;
            let currentRotation = 0;
            
            if (elapsed < 1.2) {
                const t = elapsed / 1.2;
                const easeOut = 1 - Math.pow(1 - t, 3);
                currentScale = easeOut * 1.0; 
                currentRotation = (1 - easeOut) * Math.PI * 4; 
            } 
            else if (elapsed < 2.5) {
                currentScale = 1.0;
                currentRotation = 0;
            }
            else if (elapsed < 5.0) {
                const t = (elapsed - 2.5) / 2.5;
                currentScale = 1.0 + Math.pow(t * 10, 3); 
                currentRotation = 0;
            }
            else {
                splashState = 'DONE';
                transitionToStatic();
                return;
            }

            if (splashState === 'PLAYING') {
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(currentRotation);
                ctx.scale(currentScale, currentScale);
                
                const pSize = 12; 
                const spriteW = BUFFALO_SPRITE[0].length * pSize;
                const spriteH = BUFFALO_SPRITE.length * pSize;
                drawMatrix(ctx, BUFFALO_SPRITE, PALETTE, -spriteW/2, -spriteH/2, pSize);

                ctx.fillStyle = PALETTE['4'];
                ctx.textAlign = 'center';
                ctx.letterSpacing = "-1px";
                ctx.font = 'bold 36px "Courier New"';
                ctx.fillText("BUFFALOHYDE", 0, spriteH/2 + 30);
                ctx.font = 'bold 24px "Courier New"';
                ctx.fillText("CREATIVE", 0, spriteH/2 + 60);
                ctx.restore();

                if (elapsed > 1.2 && elapsed < 2.0) {
                    const sparkleLife = elapsed - 1.2;
                    if (sparkleLife < 0.6) {
                        const scale = Math.sin((sparkleLife / 0.6) * Math.PI); 
                        const rot = sparkleLife * Math.PI; 
                        drawSparkle(centerX - 80, centerY - 40, scale, rot);
                        drawSparkle(centerX + 90, centerY + 20, scale, -rot);
                        drawSparkle(centerX - 40, centerY + 80, scale * 0.8, rot * 1.5);
                    }
                }
            }
        }
        requestAnimationFrame(bootLoop);
    }
    requestAnimationFrame(bootLoop);
  </script>
</body>
</html>
