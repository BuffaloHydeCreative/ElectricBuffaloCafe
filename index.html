<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Rhythm</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 10px;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #111; 
            border: 6px solid #333; 
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            aspect-ratio: 3 / 2;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Core Game Variables
        let gameState = 'START';
        let score = 0, combo = 0, maxCombo = 0, frame = 0;
        let notes = [];
        let hitFeedback = [];
        const HIT_X = 100;
        const NOTE_SPEED = 4;
        const HIT_TOLERANCE = 30; // Pixel distance for a valid hit

        // Theme Palette
        const C_BG = '#111111';
        const C_TRACK = '#222222';
        const C_HITLINE = '#ffffff';
        const LANE_COLORS = ['#2ed573', '#ff4757', '#ffcc00', '#1e90ff']; // Up (Green), Down (Red), B (Yellow), A (Blue)
        const LANE_LABELS = ['UP', 'DOWN', 'B', 'A'];

        // Lane Layout (Y-coordinates)
        const lanes = [100, 160, 220, 280]; 

        // ---------------------------------------------------------
        // SIGNAL BRIDGE: Listens to index.html Arcade Controls
        // ---------------------------------------------------------
        window.addEventListener('message', function(event) {
            const cmd = event.data;
            
            // Menu State Logic
            if (gameState === 'START' || gameState === 'GAME_OVER') {
                if (cmd === 'BUTTON_A') startGame();
                return;
            }

            // Gameplay State Logic
            if (gameState === 'PLAYING') {
                if (cmd === 'DPAD_UP') attemptHit(0);
                if (cmd === 'DPAD_DOWN') attemptHit(1);
                if (cmd === 'BUTTON_B') attemptHit(2);
                if (cmd === 'BUTTON_A') attemptHit(3);
            }
        });

        // ---------------------------------------------------------
        // GAME LOGIC
        // ---------------------------------------------------------
        function startGame() {
            score = 0;
            combo = 0;
            maxCombo = 0;
            frame = 0;
            notes = [];
            hitFeedback = [];
            gameState = 'PLAYING';
        }

        function spawnNote() {
            // Spawn a note randomly every ~60 frames
            if (frame % 60 === 0 && Math.random() > 0.2) {
                const targetLane = Math.floor(Math.random() * 4);
                notes.push({
                    x: canvas.width + 20,
                    lane: targetLane,
                    hit: false,
                    missed: false
                });
            }
        }

        function attemptHit(laneIndex) {
            // Find the closest un-hit note in the corresponding lane
            let closestNote = null;
            let minDistance = Infinity;

            for (let i = 0; i < notes.length; i++) {
                let n = notes[i];
                if (n.lane === laneIndex && !n.hit && !n.missed) {
                    let dist = Math.abs(n.x - HIT_X);
                    if (dist < minDistance) {
                        minDistance = dist;
                        closestNote = n;
                    }
                }
            }

            // Check if within strike tolerance
            if (closestNote && minDistance <= HIT_TOLERANCE) {
                closestNote.hit = true;
                score += 100 + (combo * 10);
                combo++;
                if (combo > maxCombo) maxCombo = combo;
                
                let feedbackText = minDistance < 10 ? "PERFECT" : "GOOD";
                spawnFeedback(feedbackText, LANE_COLORS[laneIndex], lanes[laneIndex]);
            } else {
                // Pressed a button with no note in the strike zone
                missBeat(laneIndex);
            }
        }

        function missBeat(laneIndex) {
            combo = 0;
            spawnFeedback("MISS", "#555", lanes[laneIndex]);
        }

        function spawnFeedback(text, color, yPos) {
            hitFeedback.push({ text: text, color: color, y: yPos, x: HIT_X, life: 1.0 });
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            spawnNote();

            // Move notes
            for (let i = notes.length - 1; i >= 0; i--) {
                let n = notes[i];
                if (!n.hit) {
                    n.x -= NOTE_SPEED;
                    
                    // Check if passed the hit zone without being struck
                    if (n.x < HIT_X - HIT_TOLERANCE && !n.missed) {
                        n.missed = true;
                        missBeat(n.lane);
                    }
                }
                
                // Cleanup old notes
                if (n.x < -50 || n.hit) {
                    notes.splice(i, 1);
                }
            }

            // Update floating feedback text
            for (let i = hitFeedback.length - 1; i >= 0; i--) {
                let f = hitFeedback[i];
                f.y -= 1;
                f.life -= 0.02;
                if (f.life <= 0) hitFeedback.splice(i, 1);
            }

            frame++;
            
            // Auto-end game for testing (e.g., after 2000 frames)
            if (frame > 2000) gameState = 'GAME_OVER';
        }

        // ---------------------------------------------------------
        // RENDERING
        // ---------------------------------------------------------
        function draw() {
            // Background
            ctx.fillStyle = C_BG;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'START') {
                ctx.fillStyle = LANE_COLORS[3];
                ctx.font = 'bold 40px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("FESTIVAL RHYTHM", canvas.width/2, canvas.height/2 - 20);
                
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px Courier New';
                ctx.fillText("PRESS 'A' TO START", canvas.width/2, canvas.height/2 + 30);
                return;
            }

            if (gameState === 'GAME_OVER') {
                ctx.fillStyle = '#ff4757';
                ctx.font = 'bold 40px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("TRACK COMPLETE", canvas.width/2, canvas.height/2 - 40);
                
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 20px Courier New';
                ctx.fillText(`Final Score: ${score}`, canvas.width/2, canvas.height/2 + 10);
                ctx.fillText(`Max Combo: ${maxCombo}`, canvas.width/2, canvas.height/2 + 40);
                
                ctx.fillStyle = LANE_COLORS[3];
                ctx.font = 'bold 16px Courier New';
                ctx.fillText("PRESS 'A' TO REPLAY", canvas.width/2, canvas.height/2 + 90);
                return;
            }

            // Draw Lanes
            for (let i = 0; i < 4; i++) {
                ctx.fillStyle = C_TRACK;
                ctx.fillRect(0, lanes[i] - 25, canvas.width, 50);
                
                // Lane Label
                ctx.fillStyle = '#555';
                ctx.font = 'bold 14px Courier New';
                ctx.textAlign = 'left';
                ctx.fillText(LANE_LABELS[i], 10, lanes[i] + 5);
            }

            // Draw Strike Line / Hit Zone
            ctx.strokeStyle = C_HITLINE;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(HIT_X, 60);
            ctx.lineTo(HIT_X, 320);
            ctx.stroke();

            // Draw Hit Receptacles
            for (let i = 0; i < 4; i++) {
                ctx.strokeStyle = LANE_COLORS[i];
                ctx.lineWidth = 3;
                ctx.strokeRect(HIT_X - 15, lanes[i] - 15, 30, 30);
            }

            // Draw Scrolling Notes
            for (let n of notes) {
                if (!n.hit && !n.missed) {
                    ctx.fillStyle = LANE_COLORS[n.lane];
                    ctx.fillRect(n.x - 10, lanes[n.lane] - 10, 20, 20);
                }
            }

            // UI Overlay (Score & Combo)
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px Courier New';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 20, 40);
            ctx.textAlign = 'right';
            ctx.fillStyle = combo > 10 ? '#ffcc00' : '#ffffff';
            ctx.fillText(`COMBO: ${combo}`, canvas.width - 20, 40);

            // Draw Feedback Text (Perfect, Good, Miss)
            ctx.textAlign = 'center';
            ctx.font = 'bold 16px Courier New';
            for (let f of hitFeedback) {
                ctx.fillStyle = f.color;
                ctx.globalAlpha = Math.max(0, f.life);
                ctx.fillText(f.text, f.x, f.y - 20);
                ctx.globalAlpha = 1.0;
            }
        }

        // Main Game Loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Boot
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
