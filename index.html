<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Electric Buffalo Cafe</title>
  <style>
    /* Global Reset & Base */
    body { 
      margin: 0; padding: 0; 
      background: #000; 
      color: #fff; 
      font-family: 'Courier New', Courier, monospace; 
      display: flex; justify-content: center; align-items: center;
      height: 100vh; width: 100vw;
      overflow: hidden;
      touch-action: none; 
    }

    /* Main Mobile Arcade Cabinet */
    .arcade-machine {
      width: 100%;
      max-width: 450px;
      height: 100%;
      max-height: 100vh;
      background: #0d0d0d;
      border-radius: 20px;
      border: 4px solid #333;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* --- SECTION 1: CRT MONITOR (Dynamic Flex Height) --- */
    .monitor-bezel {
      flex: 1;
      min-height: 250px; 
      background: linear-gradient(to bottom, #000 0%, #151515 100%);
      padding: 15px 15px 5px 15px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: inset 0 25px 35px rgba(0,0,0,0.9), inset 0 -5px 10px rgba(255,255,255,0.05);
    }

    .crt-screen {
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      border: 6px solid #1a1a1a;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
    }

    /* Screen States */
    .screen-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      box-sizing: border-box;
      display: none; /* Hidden by default, JS controls visibility */
    }

    /* State 1: Boot Splash */
    #boot-splash {
      background: #000;
      z-index: 15;
      display: flex; /* Visible on load */
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    /* Boot Splash Canvas Styling */
    #introCanvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated; 
      z-index: 2;
    }

    /* State 2: Static Splash */
    #static-splash {
      background: #000;
      color: #00A3A4;
      z-index: 14;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .blink-text {
      font-size: 18px;
      font-weight: bold;
      animation: blinker 1.2s linear infinite;
    }

    @keyframes blinker {
      50% { opacity: 0; }
    }

    /* State 3: The DOS Style Menu Overlay */
    #dos-menu {
      background: #000;
      color: #00A3A4;
      padding: 20px;
      flex-direction: column;
      z-index: 10;
    }

    .dos-header {
      font-weight: bold;
      margin-bottom: 15px;
      border-bottom: 2px dashed #00A3A4;
      padding-bottom: 5px;
    }

    .dos-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dos-list li {
      font-size: 14px;
      text-transform: uppercase;
      opacity: 0.5;
    }

    .dos-list li.active {
      opacity: 1;
      font-weight: bold;
      background: #00A3A4;
      color: #000;
    }

    .dos-list li::before {
      content: "  ";
      white-space: pre;
    }

    .dos-list li.active::before {
      content: "> ";
    }

    /* State 4: Game iFrame */
    #arcade-frame {
      width: 100%;
      height: 100%;
      border: none;
      z-index: 5;
    }

    /* CRT Scanline Overlay */
    .crt-screen::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 20;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
    }

    /* --- SECTION 2: CONTROL DECK (Fixed Height) --- */
    .control-deck {
      flex: 0 0 160px;
      background: linear-gradient(to bottom, #2b2b2b 0%, #1a1a1a 15%, #111 100%);
      border-top: 3px solid #666; 
      border-bottom: 8px solid #000; 
      box-shadow: 0 15px 25px rgba(0,0,0,0.9); 
      position: relative;
      padding: 0 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 5;
      box-sizing: border-box;
    }

    /* Analog-Style Drag Joystick */
    .joystick-base {
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, #1a1a1a 30%, #2a2a2a 100%);
      border-radius: 50%;
      border: 4px solid #050505;
      box-shadow: inset 0 5px 15px rgba(0,0,0,0.9), 0 2px 5px rgba(255,255,255,0.1);
      position: relative;
      touch-action: none; 
      cursor: grab;
    }

    .joystick-base:active {
      cursor: grabbing;
    }

    .joystick-stick {
      width: 65px; 
      height: 65px;
      background: radial-gradient(circle at 35% 35%, #888, #222);
      border-radius: 50%;
      position: absolute;
      top: 27.5px; left: 27.5px; 
      box-shadow: 8px 12px 15px rgba(0,0,0,0.6), inset -5px -5px 15px rgba(0,0,0,0.7);
      pointer-events: none; 
      transition: transform 0.15s ease-out; 
      z-index: 1;
    }

    .joystick-stick.dragging {
      transition: none; 
    }

    /* Concave Action Buttons */
    .action-container {
      display: flex;
      gap: 15px;
      transform: rotate(-15deg); 
    }

    .action-btn-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .action-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 3px solid #111;
      cursor: pointer;
      position: relative;
      box-shadow: inset 0 6px 12px rgba(255,255,255,0.15), inset 0 -8px 15px rgba(0,0,0,0.7), 0 6px 0 #050505, 0 10px 15px rgba(0,0,0,0.6);
      touch-action: none;
    }
    
    .action-btn::after {
      content: '';
      position: absolute;
      top: 4px; left: 10px; right: 10px; height: 18px;
      background: linear-gradient(rgba(255,255,255,0.25), transparent);
      border-radius: 20px 20px 0 0;
      pointer-events: none;
    }

    .action-btn:active, .action-btn.active-press {
      transform: translateY(6px);
      box-shadow: inset 0 6px 12px rgba(255,255,255,0.15), inset 0 -8px 15px rgba(0,0,0,0.7), 0 0 0 #050505, 0 4px 6px rgba(0,0,0,0.6);
    }

    .btn-b { background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.4) 0%, transparent 80%), #D63333; margin-top: 25px; }
    .btn-a { background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.4) 0%, transparent 80%), #00A3A4; }

    .btn-label {
      font-size: 12px;
      font-weight: bold;
      color: #777;
    }

    /* --- SECTION 3: FRONT PANEL (Fixed Height) --- */
    .front-panel {
      flex: 0 0 90px;
      background: linear-gradient(to bottom, #050505 0%, #111 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 4; 
    }

    /* Subtle Home/Start Button */
    .home-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .home-btn {
      width: 45px;
      height: 20px;
      background: #333;
      border-radius: 10px;
      border: 2px solid #111;
      cursor: pointer;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.05), 0 4px 0 #000;
      touch-action: none;
    }

    .home-btn:active {
      transform: translateY(4px);
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.05), 0 0 0 #000;
    }

    .home-label {
      font-size: 10px;
      font-weight: bold;
      color: #666;
      letter-spacing: 1px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <div class="arcade-machine">
    
    <!-- 1. CRT MONITOR -->
    <div class="monitor-bezel">
      <div class="crt-screen">
        
        <!-- State 1: Animated Boot Up -->
        <div id="boot-splash" class="screen-layer">
          <canvas id="introCanvas" width="600" height="450"></canvas>
        </div>

        <!-- State 2: Static Press Start -->
        <div id="static-splash" class="screen-layer">
          <div class="blink-text">PRESS A TO START</div>
        </div>

        <!-- State 3: OS Menu -->
        <div id="dos-menu" class="screen-layer">
          <div class="dos-header">ElectricBuffalo.EXE<br>RAM OK...</div>
          <ul class="dos-list" id="game-list">
            <li class="active">Red River Run.html</li>
            <li>La Grande Gigue.html</li>
            <li>li rassad di fleur.html</li>
            <li>li rassad.html</li>
            <li>Land Thunder!.html</li>
            <li>game6.html</li>
            <li>game7.html</li>
          </ul>
        </div>

        <!-- State 4: Game Player -->
        <iframe id="arcade-frame" class="screen-layer" title="Game Screen"></iframe>

      </div>
    </div>

    <!-- 2. CONTROL DECK -->
    <div class="control-deck">
      
      <!-- Drag/Swipe Joystick -->
      <div class="joystick-base" id="joystick-base">
        <div class="joystick-stick" id="joystick-stick"></div>
      </div>

      <!-- Action Buttons -->
      <div class="action-container">
        <div class="action-btn-wrapper">
          <div class="action-btn btn-b" onmousedown="btnAction('BUTTON_B')" ontouchstart="preventGhostClick(event, 'BUTTON_B')"></div>
          <span class="btn-label">B</span>
        </div>
        <div class="action-btn-wrapper">
          <div class="action-btn btn-a" onmousedown="btnAction('BUTTON_A')" ontouchstart="preventGhostClick(event, 'BUTTON_A')"></div>
          <span class="btn-label">A</span>
        </div>
      </div>
    </div>

    <!-- 3. FRONT PANEL -->
    <div class="front-panel">
      <!-- Subtle Home/Start Button -->
      <div class="home-container">
        <div class="home-btn" onmousedown="btnHome()" ontouchstart="preventGhostClick(event, 'HOME')"></div>
        <span class="home-label">HOME</span>
      </div>
    </div>

  </div>

  <script>
    // System State Tracker (BOOT -> STATIC -> MENU -> PLAYING)
    let machineState = 'BOOT';
    
    let currentIndex = 0;
    const games = [
      'game1.html', 'game2.html', 'game3.html', 
      'game4.html', 'game5.html', 'game6.html', 'game7.html'
    ];
    let isPlaying = false;

    // DOM Elements
    const bootSplash = document.getElementById('boot-splash');
    const staticSplash = document.getElementById('static-splash');
    const dosMenu = document.getElementById('dos-menu');
    const gameFrame = document.getElementById('arcade-frame');
    const listItems = document.querySelectorAll('#game-list li');

    function transitionToStatic() {
      machineState = 'STATIC';
      bootSplash.style.display = 'none';
      staticSplash.style.display = 'flex';
    }

    function sendSignal(command) {
      if (isPlaying) {
        gameFrame.contentWindow.postMessage(command, '*');
      }
    }

    // Single trigger action mapping to stop ghost clicks
    function preventGhostClick(e, actionType) {
      e.preventDefault(); 
      if (actionType === 'BUTTON_A' || actionType === 'BUTTON_B') {
        btnAction(actionType);
        // Visual press state
        e.target.classList.add('active-press');
        setTimeout(() => e.target.classList.remove('active-press'), 150);
      } else if (actionType === 'HOME') {
        btnHome();
      }
    }

    function pressDpad(directionStr) {
      if (machineState === 'PLAYING') {
        sendSignal(directionStr);
      } else if (machineState === 'MENU') {
        if (directionStr === 'DPAD_UP') moveMenu(-1);
        if (directionStr === 'DPAD_DOWN') moveMenu(1);
      }
    }

    function moveMenu(direction) {
      listItems[currentIndex].classList.remove('active');
      currentIndex += direction;
      if (currentIndex < 0) currentIndex = games.length - 1;
      if (currentIndex >= games.length) currentIndex = 0;
      listItems[currentIndex].classList.add('active');
    }

    function btnAction(buttonStr) {
      if (machineState === 'PLAYING') {
        sendSignal(buttonStr);
      } else if (machineState === 'STATIC' && buttonStr === 'BUTTON_A') {
        // Progress from Press Start to Menu
        machineState = 'MENU';
        staticSplash.style.display = 'none';
        dosMenu.style.display = 'flex';
      } else if (machineState === 'MENU' && buttonStr === 'BUTTON_A') {
        // Boot selected game
        machineState = 'PLAYING';
        dosMenu.style.display = 'none';
        gameFrame.style.display = 'block';
        gameFrame.src = games[currentIndex];
        isPlaying = true;
      }
    }

    function btnHome() {
      // Home button returns directly to the Static "Press Start" screen, bypassing boot
      if (machineState === 'PLAYING' || machineState === 'MENU') {
        gameFrame.src = ""; 
        gameFrame.style.display = 'none';
        dosMenu.style.display = 'none';
        
        machineState = 'STATIC';
        staticSplash.style.display = 'flex';
        isPlaying = false;
      }
    }

    /* --- ADVANCED JOYSTICK DRAG & HOLD LOGIC --- */
    const joyBase = document.getElementById('joystick-base');
    const joyStick = document.getElementById('joystick-stick');
    
    let isDragging = false;
    let currentDir = null;
    const maxRadius = 35; // Maximum visual travel of the stick
    const deadzone = 15;  // Minimum pixels required to trigger a direction

    // Continuous Hold Tracking Variables
    let holdTimer = null;
    let repeatInterval = null;

    function startSendingDirection(dir) {
      stopSendingDirection(); // Clear any existing timers
      
      // Fire the initial directional input immediately
      pressDpad(dir); 
      
      // Wait 300ms to confirm the user is intentionally "holding" it
      holdTimer = setTimeout(() => {
        // Once held, continuously pulse the direction to the game every 100ms
        repeatInterval = setInterval(() => {
          pressDpad(dir);
        }, 100); 
      }, 300);
    }

    function stopSendingDirection() {
      if (holdTimer) clearTimeout(holdTimer);
      if (repeatInterval) clearInterval(repeatInterval);
      holdTimer = null;
      repeatInterval = null;
    }

    function startDrag(e) {
      e.preventDefault();
      isDragging = true;
      joyStick.classList.add('dragging');
      moveDrag(e);
    }

    function moveDrag(e) {
      if (!isDragging) return;
      e.preventDefault();

      const rect = joyBase.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let clientX, clientY;
      if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      const dx = clientX - centerX;
      const dy = clientY - centerY;
      const distance = Math.sqrt(dx * dx + dy * dy);

      // Clamp visual stick rendering to the max radius
      let stickX = dx;
      let stickY = dy;
      if (distance > maxRadius) {
        const angle = Math.atan2(dy, dx);
        stickX = Math.cos(angle) * maxRadius;
        stickY = Math.sin(angle) * maxRadius;
      }

      joyStick.style.transform = `translate(${stickX}px, ${stickY}px)`;

      // Logic translation: determine dominant 4-way direction
      let newDir = null;
      if (distance > deadzone) {
        if (Math.abs(dx) > Math.abs(dy)) {
          newDir = dx > 0 ? 'DPAD_RIGHT' : 'DPAD_LEFT';
        } else {
          newDir = dy > 0 ? 'DPAD_DOWN' : 'DPAD_UP';
        }
      }

      // Trigger input only if direction state changes
      if (newDir !== currentDir) {
        currentDir = newDir;
        if (currentDir) {
          startSendingDirection(currentDir); // Start the initial press and hold loop
        } else {
          stopSendingDirection(); // Stick returned to center deadzone
        }
      }
    }

    function endDrag(e) {
      if (e) e.preventDefault();
      if (!isDragging) return;
      isDragging = false;
      currentDir = null;
      stopSendingDirection(); // Stop all hold events upon release
      joyStick.classList.remove('dragging');
      joyStick.style.transform = `translate(0px, 0px)`; // Snap back to center
    }

    // Attach dragging events
    joyBase.addEventListener('mousedown', startDrag);
    joyBase.addEventListener('touchstart', startDrag, { passive: false });
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('touchmove', moveDrag, { passive: false });
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchend', endDrag);

    /* --- ANIMATED BOOT SPLASH LOGIC --- */
    const canvas = document.getElementById('introCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const PALETTE = {
        '0': null, 
        '1': '#2d2d2d', // Dark Charcoal (Main Buffalo Body)
        '2': '#ffffff', // White (Horns/Hooves)
        '3': '#12AEA2', // Teal (Beard/Accents)
        '4': '#AD1C21', // Crimson Red Text
        '5': '#F7C844', // Gold Sparkle
        '6': '#ffffff', // White Sparkle Center
        '7': '#12AEA2'  // Teal (Prompt text)
    };

    const BUFFALO_SPRITE = [
        "0000000000000000",
        "0000000011100000",
        "0000000111120000",
        "0000011111121000",
        "0000111111111000",
        "0001111111111000",
        "0001111111111000",
        "0001111111133000",
        "0001111111130000",
        "0000111111100000",
        "0000100100100000",
        "0000100100100000",
        "0000000000000000",
        "0000000000000000",
        "0000000000000000",
        "0000000000000000"
    ];

    let splashState = 'WAITING'; 
    let animStartTime = 0;
    let audioCtx = null;

    // Starts animation on any tap during the BOOT phase
    window.addEventListener('click', () => {
        if (machineState === 'BOOT' && splashState === 'WAITING') {
            initAudio();
            playKaChing();
            splashState = 'PLAYING';
            animStartTime = performance.now();
        }
    });

    // Also allow touchstart for faster response on mobile
    window.addEventListener('touchstart', () => {
        if (machineState === 'BOOT' && splashState === 'WAITING') {
            initAudio();
            playKaChing();
            splashState = 'PLAYING';
            animStartTime = performance.now();
        }
    }, {passive: true});

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playKaChing() {
        if (!audioCtx) return;
        playTone(987.77, 0, 0.1, 'square');
        playTone(1318.51, 0.1, 0.6, 'sine');
    }

    function playTone(frequency, delay, duration, type) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime + delay);
        gain.gain.setValueAtTime(0, audioCtx.currentTime + delay);
        gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + delay + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + duration);
    }

    function drawMatrix(matrix, startX, startY, pixelSize, alpha = 1.0) {
        ctx.globalAlpha = alpha;
        for (let y = 0; y < matrix.length; y++) {
            for (let x = 0; x < matrix[y].length; x++) {
                const colorCode = matrix[y][x];
                if (colorCode !== '0' && PALETTE[colorCode]) {
                    ctx.fillStyle = PALETTE[colorCode];
                    ctx.fillRect(startX + (x * pixelSize), startY + (y * pixelSize), pixelSize, pixelSize);
                }
            }
        }
        ctx.globalAlpha = 1.0;
    }

    function drawSparkle(x, y, scale, rotation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.scale(scale, scale);
        ctx.fillStyle = PALETTE['5']; 
        ctx.fillRect(-2, -10, 4, 20);
        ctx.fillRect(-10, -2, 20, 4);
        ctx.fillStyle = PALETTE['6']; 
        ctx.fillRect(-1, -1, 2, 2);
        ctx.restore();
    }

    function gameLoop(timestamp) {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (splashState === 'WAITING' && machineState === 'BOOT') {
            const blink = Math.floor(timestamp / 500) % 2 === 0;
            if (blink) {
                ctx.fillStyle = PALETTE['7'];
                ctx.font = 'bold 24px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText("POWER ON", canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = '16px "Courier New"';
                ctx.fillText("(TAP ANYWHERE TO START)", canvas.width / 2, canvas.height / 2 + 25);
            }
        } 
        else if (splashState === 'PLAYING') {
            const elapsed = (timestamp - animStartTime) / 1000; 
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 - 40; 
            
            let currentScale = 0;
            let currentRotation = 0;
            
            if (elapsed < 1.2) {
                const t = elapsed / 1.2;
                const easeOut = 1 - Math.pow(1 - t, 3);
                currentScale = easeOut * 1.0; 
                currentRotation = (1 - easeOut) * Math.PI * 4; 
            } 
            else if (elapsed < 2.5) {
                currentScale = 1.0;
                currentRotation = 0;
            }
            else if (elapsed < 5.0) {
                const t = (elapsed - 2.5) / 2.5;
                currentScale = 1.0 + Math.pow(t * 10, 3); 
                currentRotation = 0;
            }
            else {
                splashState = 'DONE';
                transitionToStatic(); // Automatically move to the static arcade menu state
            }

            if (splashState === 'PLAYING') {
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(currentRotation);
                ctx.scale(currentScale, currentScale);
                
                const pSize = 12; 
                const spriteW = BUFFALO_SPRITE[0].length * pSize;
                const spriteH = BUFFALO_SPRITE.length * pSize;
                
                drawMatrix(BUFFALO_SPRITE, -spriteW/2, -spriteH/2, pSize);

                // BuffaloHyde Creative Text
                ctx.fillStyle = PALETTE['4'];
                ctx.textAlign = 'center';
                ctx.letterSpacing = "-1px";
                
                ctx.font = 'bold 36px "Courier New"';
                ctx.fillText("BUFFALOHYDE", 0, spriteH/2 + 20);
                
                ctx.font = 'bold 24px "Courier New"';
                ctx.fillText("CREATIVE", 0, spriteH/2 + 50);
                
                ctx.letterSpacing = "0px"; 

                ctx.restore();

                // Sparkles
                if (elapsed > 1.2 && elapsed < 2.0) {
                    const sparkleLife = elapsed - 1.2;
                    if (sparkleLife < 0.6) {
                        const scale = Math.sin((sparkleLife / 0.6) * Math.PI); 
                        const rot = sparkleLife * Math.PI; 
                        drawSparkle(centerX - 80, centerY - 40, scale, rot);
                        drawSparkle(centerX + 90, centerY + 20, scale, -rot);
                        drawSparkle(centerX - 40, centerY + 80, scale * 0.8, rot * 1.5);
                    }
                }
            }
        }

        if(splashState !== 'DONE') {
          requestAnimationFrame(gameLoop);
        }
    }

    requestAnimationFrame(gameLoop);

  </script>
