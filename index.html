<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Festival Arcade Mobile</title>

  <style>

    /* Global Reset & Base */

    body { 

      margin: 0; padding: 0; 

      background: #000; 

      color: #fff; 

      font-family: 'Courier New', Courier, monospace; 

      display: flex; justify-content: center; align-items: center;

      height: 100vh; overflow: hidden;

      touch-action: none; 

    }



    /* Main 9:16 Mobile Arcade Cabinet */

    .arcade-machine {

      width: 100%;

      max-width: 450px;

      aspect-ratio: 9/16;

      max-height: 100vh;

      background: #111;

      border-radius: 20px;

      border: 4px solid #333;

      display: flex;

      flex-direction: column;

      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);

      position: relative;

      overflow: hidden;

    }



    /* --- TOP HALF: CRT MONITOR --- */

    .monitor-bezel {

      flex: 0 0 50%;

      background: #050505;

      padding: 15px;

      border-bottom: 4px solid #222;

      box-sizing: border-box;

      display: flex;

      justify-content: center;

      align-items: center;

    }



    .crt-screen {

      width: 100%;

      height: 100%;

      background: #000;

      border-radius: 12px;

      position: relative;

      overflow: hidden;

      border: 6px solid #1a1a1a;

      box-shadow: inset 0 0 30px rgba(0,0,0,0.9);

    }



    /* The DOS Style Menu Overlay */

    #dos-menu {

      position: absolute;

      top: 0; left: 0; width: 100%; height: 100%;

      background: #000;

      color: #33ff33;

      padding: 20px;

      box-sizing: border-box;

      display: flex;

      flex-direction: column;

      z-index: 10;

    }



    .dos-header {

      font-weight: bold;

      margin-bottom: 15px;

      border-bottom: 2px dashed #33ff33;

      padding-bottom: 5px;

    }



    .dos-list {

      list-style: none;

      padding: 0;

      margin: 0;

      display: flex;

      flex-direction: column;

      gap: 8px;

    }



    .dos-list li {

      font-size: 14px;

      text-transform: uppercase;

      opacity: 0.5;

    }



    .dos-list li.active {

      opacity: 1;

      font-weight: bold;

      background: #33ff33;

      color: #000;

    }



    .dos-list li::before {

      content: "  ";

      white-space: pre;

    }



    .dos-list li.active::before {

      content: "> ";

    }



    /* Game iFrame */

    #arcade-frame {

      width: 100%;

      height: 100%;

      border: none;

      display: none;

      position: absolute;

      top: 0; left: 0;

      z-index: 5;

    }



    /* CRT Scanline Overlay */

    .crt-screen::after {

      content: " ";

      display: block;

      position: absolute;

      top: 0; left: 0; bottom: 0; right: 0;

      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));

      z-index: 20;

      background-size: 100% 3px, 3px 100%;

      pointer-events: none;

      box-shadow: inset 0 0 40px rgba(0,0,0,0.8);

    }



    /* --- BOTTOM HALF: CONTROL PAD --- */

    .control-deck {

      flex: 1;

      background: #1e1e1e;

      position: relative;

      padding: 20px;

      display: flex;

      align-items: center;

      justify-content: space-between;

    }



    /* D-Pad (Left Side) */

    .d-pad-container {

      width: 120px;

      height: 120px;

      position: relative;

    }

    

    .d-pad-btn {

      position: absolute;

      background: #333;

      border: 4px solid #111;

      border-radius: 4px;

      cursor: pointer;

      box-shadow: 0 4px 0 #000;

    }



    .d-pad-btn:active {

      transform: translateY(4px);

      box-shadow: 0 0 0 #000;

      background: #444;

    }



    .d-up { top: 0; left: 40px; width: 40px; height: 45px; border-bottom: none; border-radius: 8px 8px 0 0; }

    .d-down { bottom: 0; left: 40px; width: 40px; height: 45px; border-top: none; border-radius: 0 0 8px 8px; }

    .d-left { top: 40px; left: 0; width: 45px; height: 40px; border-right: none; border-radius: 8px 0 0 8px; }

    .d-right { top: 40px; right: 0; width: 45px; height: 40px; border-left: none; border-radius: 0 8px 8px 0; }

    .d-center { top: 40px; left: 40px; width: 40px; height: 40px; background: #333; border: none; }



    /* Center Home Button */

    .home-container {

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 5px;

      margin-top: 40px;

    }



    .home-btn {

      width: 45px;

      height: 20px;

      background: #555;

      border-radius: 10px;

      border: 3px solid #111;

      cursor: pointer;

      box-shadow: 0 4px 0 #000;

    }



    .home-btn:active {

      transform: translateY(4px);

      box-shadow: 0 0 0 #000;

    }



    .home-label {

      font-size: 10px;

      font-weight: bold;

      color: #888;

      letter-spacing: 1px;

    }



    /* Action Buttons (Right Side) */

    .action-container {

      display: flex;

      gap: 15px;

      transform: rotate(-15deg); 

    }



    .action-btn-wrapper {

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 8px;

    }



    .action-btn {

      width: 50px;

      height: 50px;

      border-radius: 50%;

      border: 4px solid #111;

      cursor: pointer;

      box-shadow: 0 6px 0 #000;

    }



    .action-btn:active {

      transform: translateY(6px);

      box-shadow: 0 0 0 #000;

    }



    .btn-b { background: #ffcc00; margin-top: 25px; }

    .btn-a { background: #e60000; }



    .btn-label {

      font-size: 12px;

      font-weight: bold;

      color: #888;

      white-space: nowrap;

    }

  </style>

</head>

<body>



  <div class="arcade-machine">

    

    <!-- CRT MONITOR -->

    <div class="monitor-bezel">

      <div class="crt-screen">

        

        <!-- OS Menu -->

        <div id="dos-menu">

          <div class="dos-header">FESTIVAL_OS.EXE<br>MEM OK...</div>

          <ul class="dos-list" id="game-list">

            <li class="active">game1.html</li>

            <li>game2.html</li>

            <li>game3.html</li>

            <li>game4.html</li>

            <li>game5.html</li>

            <li>game6.html</li>

            <li>game7.html</li>

          </ul>

        </div>



        <!-- The Game Player -->

        <iframe id="arcade-frame" title="Game Screen"></iframe>

      </div>

    </div>



    <!-- CONTROL PAD -->

    <div class="control-deck">

      

      <!-- Directional Pad -->

      <div class="d-pad-container">

        <div class="d-pad-btn d-up" onclick="pressDpad('DPAD_UP')"></div>

        <div class="d-pad-btn d-right" onclick="pressDpad('DPAD_RIGHT')"></div>

        <div class="d-pad-btn d-down" onclick="pressDpad('DPAD_DOWN')"></div>

        <div class="d-pad-btn d-left" onclick="pressDpad('DPAD_LEFT')"></div>

        <div class="d-center"></div>

      </div>



      <!-- Center Home Button -->

      <div class="home-container">

        <div class="home-btn" onclick="btnHome()"></div>

        <span class="home-label">HOME</span>

      </div>



      <!-- Action Buttons -->

      <div class="action-container">

        <div class="action-btn-wrapper">

          <div class="action-btn btn-b" onclick="btnAction('BUTTON_B')"></div>

          <span class="btn-label">BUTTON B</span>

        </div>

        <div class="action-btn-wrapper">

          <div class="action-btn btn-a" onclick="btnAction('BUTTON_A')"></div>

          <span class="btn-label">BUTTON A</span>

        </div>

      </div>



    </div>



  </div>



  <script>

    let currentIndex = 0;

    const games = [

      'game1.html', 'game2.html', 'game3.html', 

      'game4.html', 'game5.html', 'game6.html', 'game7.html'

    ];

    let isPlaying = false;



    const listItems = document.querySelectorAll('#game-list li');

    const dosMenu = document.getElementById('dos-menu');

    const gameFrame = document.getElementById('arcade-frame');



    // Helper: Broadcasts signal to the iframe

    function sendSignal(command) {

      if (isPlaying) {

        gameFrame.contentWindow.postMessage(command, '*');

      }

    }



    // D-Pad Control

    function pressDpad(directionStr) {

      if (isPlaying) {

        sendSignal(directionStr);

      } else {

        if (directionStr === 'DPAD_UP') moveMenu(-1);

        if (directionStr === 'DPAD_DOWN') moveMenu(1);

      }

    }



    function moveMenu(direction) {

      listItems[currentIndex].classList.remove('active');

      currentIndex += direction;

      if (currentIndex < 0) currentIndex = games.length - 1;

      if (currentIndex >= games.length) currentIndex = 0;

      listItems[currentIndex].classList.add('active');

    }



    // Action Buttons

    function btnAction(buttonStr) {

      if (isPlaying) {

        sendSignal(buttonStr);

      } else {

        if (buttonStr === 'BUTTON_A') {

          dosMenu.style.display = 'none';

          gameFrame.style.display = 'block';

          gameFrame.src = games[currentIndex];

          isPlaying = true;

        }

      }

    }



    // Home Button

    function btnHome() {

      if (isPlaying) {

        gameFrame.src = ""; // Unload game to save memory

        gameFrame.style.display = 'none';

        dosMenu.style.display = 'flex';

        isPlaying = false;

      }

    }

  </script>



</body>

</html>
