<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Festival Arcade Machine</title>
  <style>
    /* Transparent Arcade Cabinet Body */
    body { 
      margin: 0; padding: 0; 
      background: transparent; 
      color: #fff; 
      font-family: 'Courier New', Courier, monospace; 
      display: flex; flex-direction: column; 
      height: 100vh; overflow: hidden;
    }

    /* Header / Marquee */
    .marquee {
      text-align: center;
      padding: 15px 10px;
      background: rgba(15, 15, 15, 0.95);
      letter-spacing: 2px;
      font-weight: bold;
      font-size: 20px;
    }

    /* Red & Yellow Accent Lines */
    .theme-lines {
      width: 100%;
    }
    .line-red { height: 4px; background-color: #e60000; }
    .line-yellow { height: 4px; background-color: #ffcc00; }

    /* SNES-Style Icon Scroller */
    .scroller-container {
      padding: 20px 10px;
      background: rgba(25, 25, 25, 0.85);
      z-index: 10;
    }
    
    .scroller-wrapper {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .scroller {
      display: flex; 
      gap: 12px; 
      overflow-x: auto; 
      padding-bottom: 5px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none; /* Hides scrollbar for a cleaner look */
      max-width: 100%;
    }
    .scroller::-webkit-scrollbar { display: none; }

    /* Text-Only Game Cards */
    .game-card {
      flex: 0 0 120px; 
      height: 45px;
      background: #111; 
      border: 2px solid #444; 
      border-radius: 6px;
      display: flex; 
      align-items: center; 
      justify-content: center;
      cursor: pointer; 
      transition: all 0.2s ease-in-out;
      scroll-snap-align: center;
      color: #aaa;
      text-transform: uppercase;
      font-size: 14px;
      font-weight: bold;
    }

    /* Active & Hover States */
    .game-card:hover, .game-card.active {
      transform: scale(1.05);
      border-color: #ffcc00;
      color: #fff;
      background: #e60000;
      box-shadow: 0 4px 10px rgba(230, 0, 0, 0.4);
    }

    /* The CRT Screen Container */
    .screen-wrapper {
      flex: 1;
      position: relative;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .crt-monitor {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 3/4; /* Matches your mini-game dimensions */
      max-height: 100%;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 12px solid #222;
      background: #000;
    }

    iframe {
      width: 100%; 
      height: 100%; 
      border: none;
      display: block;
    }

    /* CRT Scanline Overlay (Isolated strictly to the monitor) */
    .crt-monitor::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 2;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none; /* Allows clicks to pass through to the iframe */
      box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>

  <div class="marquee">INSERT COIN // SELECT GAME</div>
  
  <div class="theme-lines">
    <div class="line-red"></div>
    <div class="line-yellow"></div>
  </div>

  <div class="scroller-container">
    <div class="scroller-wrapper">
      <div class="scroller" id="game-menu">
        
        <!-- Game 1 -->
        <div class="game-card active" onclick="loadGame('game1.html', this)">
          <div>Game 1</div>
        </div>
        
        <!-- Game 2 -->
        <div class="game-card" onclick="loadGame('game2.html', this)">
          <div>Game 2</div>
        </div>
        
        <!-- Game 3 -->
        <div class="game-card" onclick="loadGame('game3.html', this)">
          <div>Game 3</div>
        </div>
        
        <!-- Game 4 -->
        <div class="game-card" onclick="loadGame('game4.html', this)">
          <div>Game 4</div>
        </div>
        
        <!-- Game 5 -->
        <div class="game-card" onclick="loadGame('game5.html', this)">
          <div>Game 5</div>
        </div>
        
        <!-- Game 6 -->
        <div class="game-card" onclick="loadGame('game6.html', this)">
          <div>Game 6</div>
        </div>
        
        <!-- Game 7 -->
        <div class="game-card" onclick="loadGame('game7.html', this)">
          <div>Game 7</div>
        </div>

      </div>
    </div>
  </div>

  <div class="screen-wrapper">
    <div class="crt-monitor">
      <iframe id="arcade-screen" src="game1.html" title="Arcade Screen"></iframe>
    </div>
  </div>

  <script>
    function loadGame(url, cardElement) {
      // 1. Change the iframe source
      document.getElementById('arcade-screen').src = url;
      
      // 2. Remove 'active' class from all cards
      const cards = document.querySelectorAll('.game-card');
      cards.forEach(card => card.classList.remove('active'));
      
      // 3. Add 'active' class to the clicked card
      cardElement.classList.add('active');
      
      // 4. Smooth scroll the menu so the selected game is centered
      cardElement.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  </script>

</body>
</html>
