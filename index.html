<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Festival Arcade Machine</title>
  <style>
    /* Transparent Arcade Cabinet Body */
    body { 
      margin: 0; padding: 0; 
      background: transparent; 
      color: #fff; 
      font-family: 'Courier New', Courier, monospace; 
      height: 100vh; overflow: hidden;
    }

    /* Main Arcade Layout */
    .arcade-machine {
      display: flex;
      flex-direction: row;
      max-width: 800px;
      margin: 0 auto;
      height: 100%;
      background: rgba(10, 10, 10, 0.85);
      border-radius: 12px;
      padding: 15px;
      box-sizing: border-box;
    }

    /* Left Side: Vertical Game Selector */
    .scroller-container {
      width: 150px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 15px;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .scroller-container::-webkit-scrollbar { display: none; }

    /* Text-Only Game Cards */
    .game-card {
      height: 60px;
      background: #111; 
      border: 2px solid #444; 
      border-radius: 6px;
      display: flex; 
      align-items: center; 
      justify-content: center;
      cursor: pointer; 
      transition: all 0.2s ease-in-out;
      color: #aaa;
      text-transform: uppercase;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
    }

    /* Active & Hover States */
    .game-card:hover, .game-card.active {
      transform: scale(1.05);
      border-color: #ffcc00;
      color: #fff;
      background: #222;
      box-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
    }

    /* Center: Neon Tubing (Red & Yellow) */
    .neon-tubes {
      display: flex;
      gap: 8px;
      padding: 0 15px;
      flex-shrink: 0;
    }

    .tube-red {
      width: 4px;
      height: 100%;
      background: #ff9999;
      border-radius: 4px;
      box-shadow: 0 0 10px #e60000, 0 0 20px #e60000, 0 0 30px #e60000;
    }

    .tube-yellow {
      width: 4px;
      height: 100%;
      background: #ffff99;
      border-radius: 4px;
      box-shadow: 0 0 10px #ffcc00, 0 0 20px #ffcc00, 0 0 30px #ffcc00;
    }

    /* Right Side: The CRT Screen */
    .screen-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 0; /* Prevents flex overflow */
    }

    .crt-monitor {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 3/4;
      max-height: 100%;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 12px solid #222;
      background: #000;
    }

    iframe {
      width: 100%; 
      height: 100%; 
      border: none;
      display: block;
    }

    /* CRT Scanline Overlay */
    .crt-monitor::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 2;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
    }

    /* Mobile Responsiveness: Stack Vertically on Small Screens */
    @media (max-width: 600px) {
      .arcade-machine {
        flex-direction: column;
        padding: 10px;
      }
      .scroller-container {
        width: 100%;
        flex-direction: row;
        overflow-x: auto;
        padding-right: 0;
        padding-bottom: 10px;
      }
      .game-card {
        flex: 0 0 120px;
        height: 45px;
      }
      .neon-tubes {
        flex-direction: column;
        padding: 10px 0;
        height: 20px;
      }
      .tube-red, .tube-yellow {
        width: 100%;
        height: 4px;
      }
    }
  </style>
</head>
<body>

  <div class="arcade-machine">
    
    <!-- Left: Vertical Game Menu -->
    <div class="scroller-container">
      <div class="game-card active" onclick="loadGame('game1.html', this)"><div>Game 1</div></div>
      <div class="game-card" onclick="loadGame('game2.html', this)"><div>Game 2</div></div>
      <div class="game-card" onclick="loadGame('game3.html', this)"><div>Game 3</div></div>
      <div class="game-card" onclick="loadGame('game4.html', this)"><div>Game 4</div></div>
      <div class="game-card" onclick="loadGame('game5.html', this)"><div>Game 5</div></div>
      <div class="game-card" onclick="loadGame('game6.html', this)"><div>Game 6</div></div>
      <div class="game-card" onclick="loadGame('game7.html', this)"><div>Game 7</div></div>
    </div>

    <!-- Center: Glowing Neon Arcade Tubing -->
    <div class="neon-tubes">
      <div class="tube-red"></div>
      <div class="tube-yellow"></div>
    </div>

    <!-- Right: CRT Monitor -->
    <div class="screen-wrapper">
      <div class="crt-monitor">
        <iframe id="arcade-screen" src="game1.html" title="Arcade Screen"></iframe>
      </div>
    </div>

  </div>

  <script>
    function loadGame(url, cardElement) {
      document.getElementById('arcade-screen').src = url;
      const cards = document.querySelectorAll('.game-card');
      cards.forEach(card => card.classList.remove('active'));
      cardElement.classList.add('active');
      cardElement.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  </script>

</body>
</html>
