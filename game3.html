<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>li rassad di fleur</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 10px;
        }
        canvas {
            width: 100%;
            height: 100%;
            max-width: 500px;
            object-fit: contain;
            background-color: #000000; 
            border: 4px solid #222; 
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            aspect-ratio: 3 / 4;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="533"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Core Game Constants
        const COLS = 10;
        const ROWS = 10;
        const CELL_SIZE = 40;
        const OFFSET_X = 0; 
        const OFFSET_Y = 80; 
        
        // Neon Lite-Brite Colors (1: Red, 2: Blue, 3: Yellow)
        const COLORS = [null, '#ff003c', '#0077ff', '#ffea00'];
        const GLOWS = [null, '#aa0022', '#0044aa', '#aa9900'];
        
        let gameState = 'START'; 
        let board = [];
        let score = 0;
        let combo = 0;
        
        // Active falling piece
        let active = { x: 4, y: 0, c1: 1, c2: 1, dir: 0 }; 
        
        // Timing variables
        let lastDropTime = 0;
        let dropInterval = 800; // Falling speed

        // ---------------------------------------------------------
        // SIGNAL BRIDGE
        // ---------------------------------------------------------
        window.addEventListener('message', function(event) {
            const cmd = event.data;
            
            if (gameState === 'START' || gameState === 'GAME_OVER') {
                if (cmd === 'BUTTON_A') startGame();
                return;
            }

            if (gameState === 'PLAYING') {
                if (cmd === 'DPAD_LEFT') moveActive(-1, 0);
                if (cmd === 'DPAD_RIGHT') moveActive(1, 0);
                if (cmd === 'DPAD_DOWN') moveActive(0, 1); 
                if (cmd === 'BUTTON_A') rotateActive(1); 
                if (cmd === 'BUTTON_B') rotateActive(-1); 
            }
        });

        function startGame() {
            board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            
            // Starting 2x2 Base to help users build their first flower
            // Center is Blue (2), Petals are Red (1), Junk corner is Yellow (3)
            board[8][4] = 1; // Left Petal
            board[8][5] = 2; // Center
            board[9][4] = 3; // Filler
            board[9][5] = 1; // Bottom Petal
            
            score = 0;
            combo = 0;
            dropInterval = 800;
            lastDropTime = performance.now();
            spawnPiece();
            gameState = 'PLAYING';
        }

        function spawnPiece() {
            active.x = 4;
            active.y = 0;
            active.dir = 0;
            active.c1 = Math.floor(Math.random() * 3) + 1;
            active.c2 = Math.floor(Math.random() * 3) + 1;
            
            if (!isValid(active.x, active.y, active.dir)) {
                gameState = 'GAME_OVER';
            }
        }

        function getC2Pos(x, y, dir) {
            if (dir === 0) return { x: x + 1, y: y };
            if (dir === 1) return { x: x, y: y + 1 };
            if (dir === 2) return { x: x - 1, y: y };
            if (dir === 3) return { x: x, y: y - 1 };
        }

        function isValid(x, y, dir) {
            if (x < 0 || x >= COLS || y < 0 || y >= ROWS || board[y][x] !== 0) return false;
            let p2 = getC2Pos(x, y, dir);
            if (p2.x < 0 || p2.x >= COLS || p2.y < 0 || p2.y >= ROWS || board[p2.y][p2.x] !== 0) return false;
            return true;
        }

        function moveActive(dx, dy) {
            if (isValid(active.x + dx, active.y + dy, active.dir)) {
                active.x += dx;
                active.y += dy;
                return true;
            } else if (dy > 0) {
                lockPiece();
            }
            return false;
        }

        function dropInstantly() {
            while(moveActive(0, 1)) {}
            lockPiece();
        }

        function rotateActive(direction) {
            let newDir = (active.dir + direction + 4) % 4;
            if (isValid(active.x, active.y, newDir)) {
                active.dir = newDir;
            } else {
                if (isValid(active.x - 1, active.y, newDir)) { active.x -= 1; active.dir = newDir; }
                else if (isValid(active.x + 1, active.y, newDir)) { active.x += 1; active.dir = newDir; }
                else if (isValid(active.x, active.y - 1, newDir)) { active.y -= 1; active.dir = newDir; }
            }
        }

        function lockPiece() {
            board[active.y][active.x] = active.c1;
            let p2 = getC2Pos(active.x, active.y, active.dir);
            board[p2.y][p2.x] = active.c2;
            combo = 0;
            gameState = 'CASCADING';
            resolveFlowers();
        }

        function resolveFlowers() {
            let matched = findFlowers();
            if (matched.length > 0) {
                combo++;
                score += (matched.length * 100) * combo;
                dropInterval = Math.max(200, dropInterval - 10); // Speed up slightly on score
                
                matched.forEach(p => { board[p.y][p.x] = 0; });
                setTimeout(applyGravity, 300);
            } else {
                if (gameState === 'CASCADING') {
                    gameState = 'PLAYING';
                    spawnPiece();
                }
            }
        }

        // Flower Mechanic: 3x3 Cross (Top, Bottom, Left, Right match. Center is different)
        function findFlowers() {
            let matched = new Set();
            
            for (let r = 1; r < ROWS - 1; r++) {
                for (let c = 1; c < COLS - 1; c++) {
                    let center = board[r][c];
                    if (center === 0) continue;
                    
                    let top = board[r-1][c];
                    let bot = board[r+1][c];
                    let left = board[r][c-1];
                    let right = board[r][c+1];
                    
                    // Check if surrounding petals match each other, and center is different
                    if (top !== 0 && top === bot && top === left && top === right && top !== center) {
                        matched.add(`${r},${c}`);
                        matched.add(`${r-1},${c}`);
                        matched.add(`${r+1},${c}`);
                        matched.add(`${r},${c-1}`);
                        matched.add(`${r},${c+1}`);
                    }
                }
            }
            
            return Array.from(matched).map(str => {
                let parts = str.split(',');
                return { y: parseInt(parts[0]), x: parseInt(parts[1]) };
            });
        }

        function applyGravity() {
            let moved = false;
            for (let c = 0; c < COLS; c++) {
                for (let r = ROWS - 2; r >= 0; r--) {
                    if (board[r][c] !== 0) {
                        let dropTo = r;
                        while (dropTo + 1 < ROWS && board[dropTo + 1][c] === 0) {
                            dropTo++;
                        }
                        if (dropTo !== r) {
                            board[dropTo][c] = board[r][c];
                            board[r][c] = 0;
                            moved = true;
                        }
                    }
                }
            }
            
            if (moved) {
                setTimeout(resolveFlowers, 300);
            } else {
                resolveFlowers(); 
            }
        }

        // ---------------------------------------------------------
        // RENDERING
        // ---------------------------------------------------------
        function drawBead(x, y, colorCode) {
            if (colorCode === 0) return;
            let cx = x * CELL_SIZE + (CELL_SIZE / 2);
            let cy = y * CELL_SIZE + (CELL_SIZE / 2);
            
            // Lite-Brite Glow Effect
            ctx.shadowBlur = 12;
            ctx.shadowColor = GLOWS[colorCode];
            
            // Main Peg
            ctx.fillStyle = COLORS[colorCode];
            ctx.beginPath();
            ctx.arc(cx, cy, CELL_SIZE / 2.5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0;

            // Bright Center Point (Illumination)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(cx, cy, CELL_SIZE / 10, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawScene() {
            // Background
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Matrix Grid Dots
            ctx.fillStyle = '#1a1a1a';
            for(let r = 0; r <= ROWS; r++) {
                for(let c = 0; c <= COLS; c++) {
                    ctx.beginPath();
                    ctx.arc(OFFSET_X + c*CELL_SIZE, OFFSET_Y + r*CELL_SIZE, 2, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            // UI
            ctx.fillStyle = '#33ff33';
            ctx.font = 'bold 20px Courier New';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 10, 30);
            if (combo > 1) {
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffea00';
                ctx.fillText(`COMBO x${combo}`, canvas.width - 10, 30);
            }

            // Title Header
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText("li rassad di fleur", canvas.width/2, 60);

            // Play Area Bounds
            ctx.strokeStyle = '#33ff33';
            ctx.lineWidth = 2;
            ctx.strokeRect(OFFSET_X, OFFSET_Y, COLS * CELL_SIZE, ROWS * CELL_SIZE);

            if (gameState === 'START') {
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(OFFSET_X, OFFSET_Y, COLS * CELL_SIZE, ROWS * CELL_SIZE);
                
                // Title
                ctx.fillStyle = '#ff003c';
                ctx.font = 'bold 26px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("MAKE 3x3 FLOWERS", canvas.width/2, OFFSET_Y + 80);
                
                // --- Visual Example Flower ---
                let exX = canvas.width / 2;
                let exY = OFFSET_Y + 145;
                let spacing = 28; // Spacing for the mini-grid
                
                const drawMiniBead = (bx, by, cCode) => {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = GLOWS[cCode];
                    ctx.fillStyle = COLORS[cCode];
                    ctx.beginPath();
                    ctx.arc(bx, by, spacing / 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(bx, by, spacing / 10, 0, Math.PI * 2);
                    ctx.fill();
                };

                // Draw Red (1) petals and Yellow (3) center
                drawMiniBead(exX, exY - spacing, 1); // Top
                drawMiniBead(exX, exY + spacing, 1); // Bottom
                drawMiniBead(exX - spacing, exY, 1); // Left
                drawMiniBead(exX + spacing, exY, 1); // Right
                drawMiniBead(exX, exY, 3);           // Center
                // -----------------------------
                
                // Instructions
                ctx.fillStyle = '#33ff33';
                ctx.font = 'bold 16px Courier New';
                ctx.fillText("PETALS MUST MATCH", canvas.width/2, OFFSET_Y + 220);
                ctx.fillText("CENTER MUST DIFFER", canvas.width/2, OFFSET_Y + 250);
                
                // Start Prompt
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px Courier New';
                ctx.fillText("PRESS 'A' TO START", canvas.width/2, OFFSET_Y + 310);
                return;
            }

            // Draw Locked Board
            ctx.save();
            ctx.translate(OFFSET_X, OFFSET_Y);
            for(let r = 0; r < ROWS; r++) {
                for(let c = 0; c < COLS; c++) {
                    drawBead(c, r, board[r][c]);
                }
            }

            // Draw Active Piece
            if (gameState === 'PLAYING') {
                drawBead(active.x, active.y, active.c1);
                let p2 = getC2Pos(active.x, active.y, active.dir);
                drawBead(p2.x, p2.y, active.c2);
            }
            ctx.restore();

            if (gameState === 'GAME_OVER') {
                ctx.fillStyle = 'rgba(0,0,0,0.9)';
                ctx.fillRect(OFFSET_X, OFFSET_Y, COLS * CELL_SIZE, ROWS * CELL_SIZE);
                ctx.fillStyle = '#ff003c';
                ctx.font = 'bold 30px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("GAME OVER", canvas.width/2, OFFSET_Y + 180);
                
                ctx.fillStyle = '#33ff33';
                ctx.font = 'bold 18px Courier New';
                ctx.fillText(`FINAL SCORE: ${score}`, canvas.width/2, OFFSET_Y + 230);
                ctx.fillText("PRESS 'A' TO REPLAY", canvas.width/2, OFFSET_Y + 280);
            }
        }

        function gameLoop(timestamp) {
            if (gameState === 'PLAYING') {
                if (timestamp - lastDropTime > dropInterval) {
                    moveActive(0, 1);
                    lastDropTime = timestamp;
                }
            }
            drawScene();
            requestAnimationFrame(gameLoop);
        }

        // Boot
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
