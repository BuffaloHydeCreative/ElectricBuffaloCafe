<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>li rassad di fleur - Anthology</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 10px;
        }
        canvas {
            width: 100%;
            height: 100%;
            max-width: 500px;
            object-fit: contain;
            background-color: #000000; 
            border: 4px solid #222; 
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            aspect-ratio: 3 / 4;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="533"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Core Constants
        const COLS = 10;
        const CELL_SIZE = 40;
        const OFFSET_X = 0; 
        const OFFSET_Y = 80; 
        const PUZZLE_ROWS = 10;
        const STUDIO_ROWS = 11;
        
        // Neon Lite-Brite Colors (1: Red, 2: Blue, 3: Yellow, 4: White, 0: Erase)
        const COLORS = [null, '#ff003c', '#0077ff', '#ffea00', '#ffffff'];
        const GLOWS = [null, '#aa0022', '#0044aa', '#aa9900', '#aaaaaa'];
        const COLOR_NAMES = ['ERASER', 'RED BEAD', 'BLUE BEAD', 'YELLOW BEAD', 'WHITE BEAD'];
        
        // Master State Machine
        let gameState = 'MODE_SELECT'; // MODE_SELECT, PUZZLE_START, PUZZLE_DIFFICULTY, PUZZLE_PLAYING, PUZZLE_CASCADING, PUZZLE_GAMEOVER, STUDIO_START, STUDIO_PLAYING
        let currentMode = null; 
        let menuSelection = 0; // 0 = Puzzle, 1 = Studio

        // Puzzle Variables
        let puzzleDifficulty = 2; // 1 = Single Bead, 2 = Double Bead
        let puzBoard = [];
        let score = 0;
        let combo = 0;
        let active = { x: 4, y: 0, c1: 1, c2: 1, dir: 0, isSingle: false }; 
        let lastDropTime = 0;
        let dropInterval = 800; 

        // Studio Variables
        let studioBoard = [];
        let cursor = { x: 4, y: 5, color: 1 };

        // ---------------------------------------------------------
        // SIGNAL BRIDGE
        // ---------------------------------------------------------
        window.addEventListener('message', function(event) {
            const cmd = event.data; 
            
            // 1. BOOT SELECTION MENU
            if (gameState === 'MODE_SELECT') {
                if (cmd === 'DPAD_UP' || cmd === 'DPAD_DOWN') {
                    menuSelection = menuSelection === 0 ? 1 : 0;
                }
                if (cmd === 'BUTTON_A') {
                    if (menuSelection === 0) {
                        currentMode = 'PUZZLE';
                        gameState = 'PUZZLE_START';
                    } else {
                        currentMode = 'STUDIO';
                        gameState = 'STUDIO_START';
                    }
                }
                return;
            }

            // 2. PUZZLE MODE CONTROLS
            if (currentMode === 'PUZZLE') {
                if (gameState === 'PUZZLE_START') {
                    if (cmd === 'BUTTON_A') gameState = 'PUZZLE_DIFFICULTY';
                    if (cmd === 'BUTTON_B') gameState = 'MODE_SELECT';
                    return;
                }

                if (gameState === 'PUZZLE_DIFFICULTY') {
                    if (cmd === 'DPAD_UP' || cmd === 'DPAD_DOWN') {
                        puzzleDifficulty = puzzleDifficulty === 1 ? 2 : 1;
                    }
                    if (cmd === 'BUTTON_A') startPuzzleGame();
                    if (cmd === 'BUTTON_B') gameState = 'PUZZLE_START';
                    return;
                }

                if (gameState === 'PUZZLE_GAMEOVER') {
                    if (cmd === 'BUTTON_A') startPuzzleGame();
                    if (cmd === 'BUTTON_B') gameState = 'MODE_SELECT';
                    return;
                }

                if (gameState === 'PUZZLE_PLAYING') {
                    if (cmd === 'DPAD_LEFT') moveActive(-1, 0);
                    if (cmd === 'DPAD_RIGHT') moveActive(1, 0);
                    if (cmd === 'DPAD_DOWN') moveActive(0, 1); 
                    if (cmd === 'BUTTON_A') rotateActive(1); 
                    if (cmd === 'BUTTON_B') rotateActive(-1); 
                }
            }

            // 3. STUDIO MODE CONTROLS
            if (currentMode === 'STUDIO') {
                if (gameState === 'STUDIO_START') {
                    if (cmd === 'BUTTON_A') startStudioGame();
                    if (cmd === 'BUTTON_B') gameState = 'MODE_SELECT';
                    return;
                }

                if (gameState === 'STUDIO_PLAYING') {
                    if (cmd === 'DPAD_LEFT') moveCursor(-1, 0);
                    if (cmd === 'DPAD_RIGHT') moveCursor(1, 0);
                    if (cmd === 'DPAD_UP') moveCursor(0, -1); 
                    if (cmd === 'DPAD_DOWN') moveCursor(0, 1); 
                    if (cmd === 'BUTTON_B') cycleColor(); 
                    if (cmd === 'BUTTON_A') placeBead(); 
                }
            }
        });

        // ---------------------------------------------------------
        // PUZZLE LOGIC
        // ---------------------------------------------------------
        function startPuzzleGame() {
            puzBoard = Array.from({ length: PUZZLE_ROWS }, () => Array(COLS).fill(0));
            
            puzBoard[8][4] = 1; 
            puzBoard[8][5] = 2; 
            puzBoard[9][4] = 3; 
            puzBoard[9][5] = 1; 
            
            score = 0;
            combo = 0;
            dropInterval = 800;
            lastDropTime = performance.now();
            spawnPiece();
            gameState = 'PUZZLE_PLAYING';
        }

        function spawnPiece() {
            active.x = 4; active.y = 0; active.dir = 0;
            active.isSingle = (puzzleDifficulty === 1);
            active.c1 = Math.floor(Math.random() * 3) + 1;
            active.c2 = active.isSingle ? 0 : Math.floor(Math.random() * 3) + 1;

            if (!isValid(active.x, active.y, active.dir)) gameState = 'PUZZLE_GAMEOVER';
        }

        function getC2Pos(x, y, dir) {
            if (dir === 0) return { x: x + 1, y: y };
            if (dir === 1) return { x: x, y: y + 1 };
            if (dir === 2) return { x: x - 1, y: y };
            if (dir === 3) return { x: x, y: y - 1 };
        }

        function isValid(x, y, dir) {
            // Check bounds and collision for C1
            if (x < 0 || x >= COLS || y < 0 || y >= PUZZLE_ROWS || puzBoard[y][x] !== 0) return false;
            
            // Check bounds and collision for C2 if playing Double Bead mode
            if (!active.isSingle) {
                let p2 = getC2Pos(x, y, dir);
                if (p2.x < 0 || p2.x >= COLS || p2.y < 0 || p2.y >= PUZZLE_ROWS || puzBoard[p2.y][p2.x] !== 0) return false;
            }
            return true;
        }

        function moveActive(dx, dy) {
            if (isValid(active.x + dx, active.y + dy, active.dir)) {
                active.x += dx; active.y += dy;
                return true;
            } else if (dy > 0) {
                lockPiece();
            }
            return false;
        }

        function rotateActive(direction) {
            if (active.isSingle) return; // No rotation needed for a single bead

            let newDir = (active.dir + direction + 4) % 4;
            if (isValid(active.x, active.y, newDir)) active.dir = newDir;
            else {
                if (isValid(active.x - 1, active.y, newDir)) { active.x -= 1; active.dir = newDir; }
                else if (isValid(active.x + 1, active.y, newDir)) { active.x += 1; active.dir = newDir; }
                else if (isValid(active.x, active.y - 1, newDir)) { active.y -= 1; active.dir = newDir; }
            }
        }

        function lockPiece() {
            puzBoard[active.y][active.x] = active.c1;
            if (!active.isSingle) {
                let p2 = getC2Pos(active.x, active.y, active.dir);
                puzBoard[p2.y][p2.x] = active.c2;
            }
            combo = 0;
            gameState = 'PUZZLE_CASCADING';
            applyGravity();
        }

        function applyGravity() {
            let moved = false;
            for (let c = 0; c < COLS; c++) {
                for (let r = PUZZLE_ROWS - 2; r >= 0; r--) {
                    if (puzBoard[r][c] !== 0) {
                        let dropTo = r;
                        while (dropTo + 1 < PUZZLE_ROWS && puzBoard[dropTo + 1][c] === 0) dropTo++;
                        if (dropTo !== r) {
                            puzBoard[dropTo][c] = puzBoard[r][c];
                            puzBoard[r][c] = 0;
                            moved = true;
                        }
                    }
                }
            }
            if (moved) setTimeout(resolveFlowers, 300);
            else resolveFlowers(); 
        }

        function resolveFlowers() {
            let matched = findFlowers();
            if (matched.length > 0) {
                combo++;
                score += (matched.length * 100) * combo;
                dropInterval = Math.max(200, dropInterval - 10); 
                matched.forEach(p => { puzBoard[p.y][p.x] = 0; });
                setTimeout(applyGravity, 300);
            } else {
                if (gameState === 'PUZZLE_CASCADING') {
                    gameState = 'PUZZLE_PLAYING';
                    spawnPiece();
                }
            }
        }

        function findFlowers() {
            let matched = new Set();
            for (let r = 1; r < PUZZLE_ROWS - 1; r++) {
                for (let c = 1; c < COLS - 1; c++) {
                    let center = puzBoard[r][c];
                    if (center === 0) continue;
                    let top = puzBoard[r-1][c], bot = puzBoard[r+1][c], left = puzBoard[r][c-1], right = puzBoard[r][c+1];
                    if (top !== 0 && top === bot && top === left && top === right && top !== center) {
                        matched.add(`${r},${c}`); matched.add(`${r-1},${c}`); matched.add(`${r+1},${c}`);
                        matched.add(`${r},${c-1}`); matched.add(`${r},${c+1}`);
                    }
                }
            }
            return Array.from(matched).map(str => {
                let parts = str.split(',');
                return { y: parseInt(parts[0]), x: parseInt(parts[1]) };
            });
        }

        // ---------------------------------------------------------
        // STUDIO LOGIC
        // ---------------------------------------------------------
        function startStudioGame() {
            studioBoard = Array.from({ length: STUDIO_ROWS }, () => Array(COLS).fill(0));
            gameState = 'STUDIO_PLAYING';
        }

        function moveCursor(dx, dy) {
            cursor.x = Math.max(0, Math.min(COLS - 1, cursor.x + dx));
            cursor.y = Math.max(0, Math.min(STUDIO_ROWS - 1, cursor.y + dy));
        }

        function cycleColor() {
            cursor.color = (cursor.color + 1) % 5;
        }

        function placeBead() {
            studioBoard[cursor.y][cursor.x] = cursor.color;
        }

        // ---------------------------------------------------------
        // RENDERING
        // ---------------------------------------------------------
        function drawBead(x, y, colorCode, alpha = 1.0) {
            if (colorCode === 0) return;
            let cx = x * CELL_SIZE + (CELL_SIZE / 2);
            let cy = y * CELL_SIZE + (CELL_SIZE / 2);
            ctx.globalAlpha = alpha;
            ctx.shadowBlur = 12;
            ctx.shadowColor = GLOWS[colorCode];
            ctx.fillStyle = COLORS[colorCode];
            ctx.beginPath(); ctx.arc(cx, cy, CELL_SIZE / 2.5, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(cx, cy, CELL_SIZE / 10, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1.0;
        }

        function drawGrid(rows) {
            ctx.fillStyle = '#1a1a1a';
            for(let r = 0; r <= rows; r++) {
                for(let c = 0; c <= COLS; c++) {
                    ctx.beginPath();
                    ctx.arc(OFFSET_X + c*CELL_SIZE, OFFSET_Y + r*CELL_SIZE, 2, 0, Math.PI*2);
                    ctx.fill();
                }
            }
            ctx.strokeStyle = '#33ff33';
            ctx.lineWidth = 2;
            ctx.strokeRect(OFFSET_X, OFFSET_Y, COLS * CELL_SIZE, rows * CELL_SIZE);
        }

        function drawScene() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'MODE_SELECT') {
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 24px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("li rassad di fleur", canvas.width/2, 100);
                
                ctx.fillStyle = menuSelection === 0 ? '#33ff33' : '#555555';
                ctx.font = 'bold 20px Courier New';
                ctx.fillText("> PUZZLE SOLVER <", canvas.width/2, 250);

                ctx.fillStyle = menuSelection === 1 ? '#33ff33' : '#555555';
                ctx.fillText("> BEAD STUDIO <", canvas.width/2, 300);

                ctx.fillStyle = '#aaaaaa';
                ctx.font = 'bold 14px Courier New';
                ctx.fillText("USE D-PAD TO SELECT", canvas.width/2, 420);
                ctx.fillText("PRESS 'A' TO START", canvas.width/2, 450);
                return;
            }

            // --- PUZZLE RENDERING ---
            if (currentMode === 'PUZZLE') {
                drawGrid(PUZZLE_ROWS);

                ctx.fillStyle = '#33ff33';
                ctx.font = 'bold 20px Courier New';
                ctx.textAlign = 'left'; ctx.fillText(`SCORE: ${score}`, 10, 30);
                if (combo > 1) {
                    ctx.textAlign = 'right'; ctx.fillStyle = '#ffea00';
                    ctx.fillText(`COMBO x${combo}`, canvas.width - 10, 30);
                }

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px Courier New';
                ctx.textAlign = 'center'; ctx.fillText("PUZZLE MODE", canvas.width/2, 60);

                if (gameState === 'PUZZLE_START') {
                    ctx.fillStyle = 'rgba(0,0,0,0.85)';
                    ctx.fillRect(OFFSET_X, OFFSET_Y, COLS * CELL_SIZE, PUZZLE_ROWS * CELL_SIZE);
                    ctx.fillStyle = '#ff003c'; ctx.font = 'bold 26px Courier New'; ctx.textAlign = 'center';
                    ctx.fillText("MAKE 3x3 FLOWERS", canvas.width/2, OFFSET_Y + 80);
                    
                    let exX = canvas.width / 2; let exY = OFFSET_Y + 145; let spacing = 28; 
                    const drawMini = (bx, by, cCode) => {
                        ctx.shadowBlur = 10; ctx.shadowColor = GLOWS[cCode]; ctx.fillStyle = COLORS[cCode];
                        ctx.beginPath(); ctx.arc(bx, by, spacing / 2.5, 0, Math.PI * 2); ctx.fill();
                        ctx.shadowBlur = 0; ctx.fillStyle = '#ffffff';
                        ctx.beginPath(); ctx.arc(bx, by, spacing / 10, 0, Math.PI * 2); ctx.fill();
                    };
                    drawMini(exX, exY - spacing, 1); drawMini(exX, exY + spacing, 1);
                    drawMini(exX - spacing, exY, 1); drawMini(exX + spacing, exY, 1); drawMini(exX, exY, 3);
                    
                    ctx.fillStyle = '#33ff33'; ctx.font = 'bold 16px Courier New';
                    ctx.fillText("PETALS MUST MATCH", canvas.width/2, OFFSET_Y + 220);
                    ctx.fillText("CENTER MUST DIFFER", canvas.width/2, OFFSET_Y + 250);
                    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 18px Courier New';
                    ctx.fillText("PRESS 'A' TO CONTINUE", canvas.width/2, OFFSET_Y + 310);
                    ctx.font = 'bold 12px Courier New'; ctx.fillStyle = '#777';
                    ctx.fillText("PRESS 'B' TO RETURN", canvas.width/2, OFFSET_Y + 340);
                    return;
                }

                if (gameState === 'PUZZLE_DIFFICULTY') {
                    ctx.fillStyle = 'rgba(0,0,0,0.85)';
                    ctx.fillRect(OFFSET_X, OFFSET_Y, COLS * CELL_SIZE, PUZZLE_ROWS * CELL_SIZE);
                    
                    ctx.fillStyle = '#ffea00';
                    ctx.font = 'bold 26px Courier New';
                    ctx.textAlign = 'center';
                    ctx.fillText("SELECT DIFFICULTY", canvas.width/2, OFFSET_Y + 100);

                    ctx.font = 'bold 20px Courier New';
                    ctx.fillStyle = puzzleDifficulty === 1 ? '#33ff33' : '#555555';
                    ctx.fillText("> I - SINGLE BEAD <", canvas.width/2, OFFSET_Y + 180);

                    ctx.fillStyle = puzzleDifficulty === 2 ? '#33ff33' : '#555555';
                    ctx.fillText("> II - DOUBLE BEAD <", canvas.width/2, OFFSET_Y + 230);

                    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 18px Courier New';
                    ctx.fillText("PRESS 'A' TO START", canvas.width/2, OFFSET_Y + 310);
                    ctx.font = 'bold 12px Courier New'; ctx.fillStyle = '#777';
                    ctx.fillText("PRESS 'B' TO RETURN", canvas.width/2, OFFSET_Y + 340);
                    return;
                }

                ctx.save(); ctx.translate(OFFSET_X, OFFSET_Y);
                for(let r = 0; r < PUZZLE_ROWS; r++) {
                    for(let c = 0; c < COLS; c++) drawBead(c, r, puzBoard[r][c]);
                }
                if (gameState === 'PUZZLE_PLAYING') {
                    drawBead(active.x, active.y, active.c1);
                    if (!active.isSingle) {
                        let p2 = getC2Pos(active.x, active.y, active.dir);
                        drawBead(p2.x, p2.y, active.c2);
                    }
                }
                ctx.restore();

                if (gameState === 'PUZZLE_GAMEOVER') {
                    ctx.fillStyle = 'rgba(0,0,0,0.9)'; ctx.fillRect(OFFSET_X, OFFSET_Y, COLS * CELL_SIZE, PUZZLE_ROWS * CELL_SIZE);
                    ctx.fillStyle = '#ff003c'; ctx.font = 'bold 30px Courier New'; ctx.textAlign = 'center';
                    ctx.fillText("GAME OVER", canvas.width/2, OFFSET_Y + 150);
                    ctx.fillStyle = '#33ff33'; ctx.font = 'bold 18px Courier New';
                    ctx.fillText(`FINAL SCORE: ${score}`, canvas.width/2, OFFSET_Y + 200);
                    ctx.fillText("PRESS 'A' TO REPLAY", canvas.width/2, OFFSET_Y + 260);
                    ctx.fillStyle = '#777'; ctx.font = 'bold 12px Courier New';
                    ctx.fillText("PRESS 'B' TO RETURN", canvas.width/2, OFFSET_Y + 290);
                }
            }

            // --- STUDIO RENDERING ---
            if (currentMode === 'STUDIO') {
                drawGrid(STUDIO_ROWS);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px Courier New';
                ctx.textAlign = 'center'; ctx.fillText("STUDIO MODE", canvas.width/2, 30);
                
                if (gameState === 'STUDIO_PLAYING') {
                    ctx.fillStyle = cursor.color === 0 ? '#ff003c' : COLORS[cursor.color];
                    ctx.font = 'bold 16px Courier New';
                    ctx.fillText(`BRUSH: ${COLOR_NAMES[cursor.color]}`, canvas.width/2, 60);
                }

                if (gameState === 'STUDIO_START') {
                    ctx.fillStyle = 'rgba(0,0,0,0.85)';
                    ctx.fillRect(OFFSET_X, OFFSET_Y, COLS * CELL_SIZE, STUDIO_ROWS * CELL_SIZE);
                    ctx.fillStyle = '#ffea00'; ctx.font = 'bold 26px Courier New'; ctx.textAlign = 'center';
                    ctx.fillText("BEADWORK STUDIO", canvas.width/2, OFFSET_Y + 120);
                    ctx.fillStyle = '#33ff33'; ctx.font = 'bold 16px Courier New';
                    ctx.fillText("DPAD   : MOVE CURSOR", canvas.width/2, OFFSET_Y + 190);
                    ctx.fillText("BTN B  : CHANGE COLOR", canvas.width/2, OFFSET_Y + 230);
                    ctx.fillText("BTN A  : PLACE/ERASE", canvas.width/2, OFFSET_Y + 270);
                    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 18px Courier New';
                    ctx.fillText("PRESS 'A' TO START", canvas.width/2, OFFSET_Y + 350);
                    ctx.fillStyle = '#777'; ctx.font = 'bold 12px Courier New';
                    ctx.fillText("PRESS 'B' TO RETURN", canvas.width/2, OFFSET_Y + 380);
                    return;
                }

                ctx.save(); ctx.translate(OFFSET_X, OFFSET_Y);
                for(let r = 0; r < STUDIO_ROWS; r++) {
                    for(let c = 0; c < COLS; c++) drawBead(c, r, studioBoard[r][c]);
                }
                if (cursor.color !== 0) drawBead(cursor.x, cursor.y, cursor.color, 0.6);
                let isBlinkOn = Math.floor(Date.now() / 300) % 2 === 0;
                ctx.strokeStyle = isBlinkOn ? '#ffffff' : '#333333';
                ctx.lineWidth = 3;
                ctx.strokeRect(cursor.x * CELL_SIZE, cursor.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                ctx.restore();
            }
        }

        function gameLoop(timestamp) {
            if (currentMode === 'PUZZLE' && gameState === 'PUZZLE_PLAYING') {
                if (timestamp - lastDropTime > dropInterval) {
                    moveActive(0, 1);
                    lastDropTime = timestamp;
                }
            }
            drawScene();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
